# Release pipeline for tl — native artifacts on a SemVer tag.
#
# This workflow path is part of the signing identity: GitHub's OIDC certificate
# names the workflow that requested it, and `release/identity.json` pins that
# name. Signing therefore runs *directly here* rather than in a reusable
# workflow, which would change the certificate's `job_workflow_ref` and break
# the pin every verifier checks (ADR-0006 "Release integrity and provenance").
# Renaming or moving this file is an identity rotation, not a refactor: see the
# rotation procedure in VERIFYING.md.
#
# The correctness gates themselves live in ci.yml and AGENTS.md; this workflow
# re-runs them against the tagged commit rather than trusting that the tag
# happens to point at a commit CI already saw.
name: Release

on:
  push:
    tags:
      # A coarse filter only. GitHub's tag globs have no alternation and no
      # repetition bounds, so they cannot express SemVer — `v01.0.0` and
      # `v1.2.3-` both match these. The stamp job re-checks the tag against
      # the pinned certificate identity expression before anything is built,
      # which is where a tag the signing identity would later reject gets
      # rejected instead of after a full matrix run.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # A build-only rehearsal: everything up to and including the artifacts and
  # their smoke tests, with no signing and no GitHub Release. Useful for
  # exercising the matrix before committing to a tag, and safe because a
  # non-tag run could not produce a certificate identity that verifies anyway.
  workflow_dispatch:
    inputs:
      handoff_only:
        description: Run the gates and capability-free tool handoff without the release matrix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The Linux artifacts are built inside this image so they inherit its glibc
  # rather than the runner's. Ubuntu 18.04 carries glibc 2.27, the floor
  # ADR-0006 documents (Lean's own floors are 2.26 on x86-64 and 2.27 on
  # aarch64). Pinned by multi-arch index digest, so both Linux legs resolve the
  # same published image and a moved tag cannot change what we build against.
  GLIBC_FLOOR_IMAGE: "ubuntu@sha256:152dc042452c496007f07ca9127571cb9c29697f42acbfad72324b2bb2e43c98"
  GLIBC_FLOOR: "2.27"
  # elan installs the pinned Lean toolchain inside that image, where the
  # node-based setup actions cannot run. Hash-pinned like the floor-git tarball
  # in ci.yml: the download is checked before it is executed. The per-target
  # digests are in the build matrix, next to the triple they belong to.
  ELAN_VERSION: "v4.2.3"

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Which channels this release publishes through, read from
    # release/plan.json rather than assumed. The privileged publish jobs gate
    # on these, so a deferred channel has no job to skip — it has no job. Until
    # this existed nothing read the plan, and a v0.1.0 tag would have published
    # the GitHub Release and then failed at Homebrew for a credential the
    # release had deliberately deferred.
    outputs:
      npm: ${{ steps.plan.outputs.npm }}
      homebrew: ${{ steps.plan.outputs.homebrew }}
      # Same-run transport equality, not a raw file digest or provenance.
      # Every consumer hashes the downloaded one-file set before execution.
      releaseToolFileSetHash: ${{ steps.tool_file_set_hash.outputs.fileSetHash }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl -sSfL --retry 3 -o "$tmp/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp" actionlint
          install -m 0755 "$tmp/actionlint" /usr/local/bin/actionlint

      # Both workflows use the typed registry. This profile selects enabled
      # channels from the release plan; CI exercises deferred channels too.
      # --strict makes a missing tool a failed gate. CI's stripped container
      # independently executes this profile without the forbidden runtimes.
      # Restore-only. ci.yml's policy is that only protected main saves the
      # shared caches; a tag build consumes them and saves nothing.
      - name: restore mathlib olean archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mathlib
          key: trusted-main-v1-mathlib-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: build (lake build --wfail)
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "true"
          build-args: "--wfail"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"

      - name: build trust verifier warning-free
        run: lake build tlverify --wfail
      - name: build the release tool warning-free
        run: lake build tlrelease --wfail

      - name: typed release policy
        if: github.ref_type != 'tag'
        run: ./.lake/build/bin/tlrelease policy --profile release --strict
      - name: typed release policy on a tag
        if: github.ref_type == 'tag'
        run: ./.lake/build/bin/tlrelease policy --profile release --strict --tag

      # One version everywhere, and against the tag when there is one, before
      # the build matrix consumes the stamp.
      - name: one version across every copy of it
        run: ./.lake/build/bin/tlrelease version-consistency --root .
      - name: the release tag agrees with the product version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./.lake/build/bin/tlrelease version-consistency --root . --tag "$RELEASE_TAG"

      - name: the shipped uname mappings match the typed platform authority
        run: ./.lake/build/bin/tlrelease platform-classification --root . --targets release/targets.json

      # No task-tracker id in the artifact being released. Here rather than
      # before the build for the same reason as the two above: the gate is a
      # Lean binary now, and it runs on the tagged commit where the toolchain
      # exists.
      - name: no tracker id in a tracked artifact
        run: ./.lake/build/bin/tlrelease task-id-lint --root .

      # Before anything is built or signed: the scripts this workflow is about
      # to run, read for an invocation of python, python3, ruby, brew, node or
      # npm. A release that stops at an interpreter the operator's machine does
      # not have, or at a runtime for a channel it deliberately defers, fails
      # after the tag exists — which is the one point at which it cannot be
      # undone by fixing the commit.
      - name: the v0.1 dependency boundary
        run: ./.lake/build/bin/tlrelease dependency-boundary --root . --plan release/plan.json
      - name: trust boundary (lake exe tlverify)
        run: lake exe tlverify
      - name: test (lake exe tltest)
        run: lake exe tltest

      # The enabled channels, for the publish jobs to gate on. Emitted for
      # every channel including the enabled ones: a command that printed only
      # what was on would make "off" and "this build does not know that
      # channel" the same observation, and a workflow reading a missing output
      # gets the empty string — which would silently disable a channel that was
      # supposed to publish.
      - name: which channels this release publishes through
        id: plan
        run: ./.lake/build/bin/tlrelease workflow-plan --plan release/plan.json --output "$GITHUB_OUTPUT"

      # A deferral has to point forwards. `plannedFor` parsing as a version
      # makes it a commitment; this is what stops the commitment expiring
      # silently. A channel deferred to a release that has shipped was not
      # postponed, it was forgotten — it would go on naming the same release
      # through that release and every one after it, and the plan would read as
      # a decision nobody made. Only on a tag, because only then is there a
      # release being cut to compare against; Tests/ReleaseTests.lean applies
      # the same rule to the product version on every commit.
      - name: deferred channels still point past this release
        if: github.ref_type == 'tag'
        run: ./.lake/build/bin/tlrelease plan-deferrals release/plan.json "${GITHUB_REF_NAME}"

      # The pin itself: one canonical expression, generated from the repository
      # and the workflow path plus the fixed tag grammar, and held to the mirror
      # in release/identity.json. It also runs the adversarial accept/reject
      # table the shell gate used to run against Python's regex engine — a
      # different engine from cosign's RE2, which is why that gate had to refuse
      # by hand the constructs RE2 rejects.
      - name: the pinned signing identity is canonical and discriminates
        run: ./.lake/build/bin/tlrelease identity-check --identity release/identity.json

      # The tag glob that triggered this run cannot express SemVer, and the
      # signing identity can. Checking the tag here — before the build matrix —
      # turns "four platform builds, then an unsignable artifact" into an
      # immediate refusal. The identity is composed from the values this run
      # actually carries, so it is the certificate this run would present and
      # not a restatement of the pin.
      - name: the tag is one the signing identity will accept
        if: github.ref_type == 'tag'
        env:
          CERTIFICATE_SAN: https://github.com/${{ github.workflow_ref }}
        run: ./.lake/build/bin/tlrelease identity-accepts --identity release/identity.json --san "$CERTIFICATE_SAN"

      # The signing job writes the SBOM with this binary. It travels as an
      # artifact rather than being rebuilt there: a Lean toolchain and the whole
      # dependency set would have to be provisioned in the one job that holds a
      # signing identity, to build an executable this job has already built and
      # gated on the same commit.
      - name: stage the release tool
        run: install -D -m 0755 .lake/build/bin/tlrelease release-tool/tlrelease

      - name: hash the staged release tool file set
        id: tool_file_set_hash
        env:
          RELEASE_TOOL_FILE_SET_HASH: ${{ hashFiles('release-tool/tlrelease') }}
        run: printf '%s\n' "fileSetHash=$RELEASE_TOOL_FILE_SET_HASH" >> "$GITHUB_OUTPUT"


      - name: upload the release tool for the signing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tool
          path: release-tool/tlrelease
          if-no-files-found: error
          retention-days: 7

  handoff-rehearsal:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: download the release tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tool
          path: tool
      - name: refuse a missing or changed release tool
        if: needs.gates.outputs.releaseToolFileSetHash == '' || hashFiles('tool/tlrelease') == '' || needs.gates.outputs.releaseToolFileSetHash != hashFiles('tool/tlrelease')
        run: /usr/bin/false
      - name: make the validated release tool executable
        run: /bin/chmod 0755 tool/tlrelease
      - name: enter the validated release tool
        run: ./tool/tlrelease --help

  # ---------------------------------------------------------------------------
  # 2. One build stamp for the whole matrix.
  #
  # Every artifact must report the same source commit and dependency identity.
  # Generating the stamp once and shipping it to each leg makes that true by
  # construction, instead of relying on four independent runs of the generator
  # agreeing.
  # ---------------------------------------------------------------------------
  stamp:
    if: github.event_name != 'workflow_dispatch' || !inputs.handoff_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gates]
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      commit: ${{ steps.stamp.outputs.commit }}
      stampDigest: ${{ steps.stamp.outputs.stampDigest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: a rehearsal is not a release
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
        run: /usr/bin/false

      - name: download the release tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tool
          path: tool

      - name: refuse a missing or changed release tool
        if: needs.gates.outputs.releaseToolFileSetHash == '' || hashFiles('tool/tlrelease') == '' || needs.gates.outputs.releaseToolFileSetHash != hashFiles('tool/tlrelease')
        run: /usr/bin/false

      - name: make the validated release tool executable
        run: /bin/chmod 0755 tool/tlrelease

      - name: enter the validated release tool
        run: ./tool/tlrelease --help

      - name: validate the release identity
        run: ./tool/tlrelease identity-check --identity release/identity.json

      - name: stamp the tagged commit
        id: stamp
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: ./tool/tlrelease workflow-stamp --root . --ref-type "$RELEASE_REF_TYPE" --ref-name "$RELEASE_REF_NAME" --output "$GITHUB_OUTPUT"

      - name: upload the stamp
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tl-build-stamp
          path: Tl/Build/Stamp.lean
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [gates, stamp]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-latest
            container: true
            best_effort: false
            elan_triple: x86_64-unknown-linux-gnu
            elan_sha256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            container: true
            best_effort: false
            elan_triple: aarch64-unknown-linux-gnu
            elan_sha256: cb69af0803b04157bc30201c29c12fca882bb3ad8b43476b8d2d3064810bc3ac
          - target: darwin-arm64
            runs-on: macos-15
            container: false
            best_effort: false
          # macOS x86-64 is Lean Tier 2 and our Best-effort tier: smoke-tested,
          # not release-blocking (ADR-0006). `fail-fast: false` alone would not
          # deliver that — it lets the other legs finish, but a failed leg still
          # fails the matrix job and blocks the downstream signing job.
          # `continue-on-error` is what actually makes this leg non-blocking;
          # the sign job then checks which artifacts arrived, so a missing
          # best-effort binary is reported rather than silently omitted, and a
          # missing Supported one still stops the release. macos-15-intel is
          # the last x86-64 macOS image GitHub offers.
          - target: darwin-x64
            runs-on: macos-15-intel
            container: false
            best_effort: true
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ matrix.best_effort }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: download the stamp
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tl-build-stamp
          path: Tl/Build

      # The whole file, by digest, not one line of it. This is Lean source that
      # is compiled into the released binary: a file carrying the expected
      # `stampCommit` line *and* three more declarations satisfied a substring
      # test and went into all four artifacts. Comparing the bytes the stamp
      # job published leaves nothing for extra content to hide behind.
      - name: confirm the shared stamp landed unchanged
        run: |
          set -euo pipefail
          want='${{ needs.stamp.outputs.stampDigest }}'
          if [ -z "$want" ]; then
            echo "::error::the stamp job published no digest for Tl/Build/Stamp.lean, so this leg cannot tell whether it is compiling the shared stamp. An empty expectation must not pass for a matching one."
            exit 1
          fi
          got_line=$(sha256sum Tl/Build/Stamp.lean)
          got=${got_line%% *}
          if [ "$got" != "$want" ]; then
            echo "::error::this leg's Tl/Build/Stamp.lean hashes to ${got}, but the stamp job published ${want}. These are not the bytes every leg is supposed to compile — the download step overwrote the wrong path, the artifact is stale, or something wrote into the file between the two. Nothing is built from it."
            exit 1
          fi
          if ! grep -q "stampCommit : String := \"${{ needs.stamp.outputs.commit }}\"" Tl/Build/Stamp.lean; then
            echo "::error::the shared stamp does not name commit ${{ needs.stamp.outputs.commit }}. The digest above matched, so the stamp job itself stamped the wrong commit."
            exit 1
          fi

      - name: restore mathlib olean archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mathlib
          key: trusted-main-v1-mathlib-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      # --- Linux: build inside the glibc-floor image ---------------------------
      #
      # The node-based setup actions cannot run in an image this old, so the
      # whole build is one `docker run`: install elan from a hash-pinned
      # tarball, fetch the mathlib olean cache, build the binary. The host's
      # ~/.cache/mathlib is mounted in so the restore above is not wasted.
      - name: build inside the glibc ${{ env.GLIBC_FLOOR }} image
        if: matrix.container
        env:
          ELAN_SHA256: ${{ matrix.elan_sha256 }}
          ELAN_TRIPLE: ${{ matrix.elan_triple }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/mathlib"
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$HOME/.cache/mathlib:/root/.cache/mathlib" \
            -e ELAN_VERSION="${ELAN_VERSION}" \
            -e ELAN_SHA256="${ELAN_SHA256}" \
            -e ELAN_TRIPLE="${ELAN_TRIPLE}" \
            "${GLIBC_FLOOR_IMAGE}" \
            bash -euo pipefail -c '
              # No sources rewrite. 18.04 is past end of standard support but
              # has not moved to old-releases: archive.ubuntu.com,
              # security.ubuntu.com and ports.ubuntu.com (the arm64 archive)
              # all still serve bionic, while old-releases returns 404 for it.
              # Rewriting to old-releases would break both Linux legs, and an
              # arm64-blind rewrite would miss ports.ubuntu.com entirely.
              apt-get update -q
              apt-get install -y -q --no-install-recommends \
                ca-certificates curl git gcc libc6-dev make xz-utils
              # The checkout is owned by the runner user, not root.
              git config --global --add safe.directory /src

              tmp=$(mktemp -d)
              curl -sSfL --retry 3 -o "$tmp/elan.tar.gz" \
                "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-${ELAN_TRIPLE}.tar.gz"
              echo "${ELAN_SHA256}  $tmp/elan.tar.gz" | sha256sum -c -
              tar -xzf "$tmp/elan.tar.gz" -C "$tmp"
              "$tmp/elan-init" -y --default-toolchain none >/dev/null
              export PATH="/root/.elan/bin:$PATH"
              elan toolchain install "$(cat lean-toolchain)"
              elan override set "$(cat lean-toolchain)"

              # Prebuilt mathlib oleans. `cache get` does not fail on a miss,
              # it just leaves the oleans to be built from source — which takes
              # hours rather than minutes, so a miss is worth naming in the log
              # even though it is not fatal.
              lake exe cache get 2>&1 | tee /tmp/cache-get.log
              if grep -qi "not found\|no such file" /tmp/cache-get.log; then
                echo "::warning::the mathlib olean cache did not cover this toolchain/manifest pair — this leg is building mathlib from source and will take hours. Check that the pinned revisions in lake-manifest.json have published caches."
              fi
              lake build tl
              # The leg writes its own build record, and does so with the
              # same audited Lean the sign job holds it to. Built here rather
              # than carried in from the plan job, whose binary is linux-x64
              # and would not run on three of the four legs.
              lake build tlrelease
            '
          # The container wrote as root; hand both trees back so later steps and
          # the runner cleanup can touch them.
          sudo chown -R "$(id -u):$(id -g)" .lake "$HOME/.cache/mathlib"

      # --- macOS: build on the runner -----------------------------------------
      - name: build (macOS)
        if: ${{ !matrix.container }}
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "true"
          build-args: "tl"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"

      # The leg writes its own build record with the same audited Lean the sign
      # job holds it to. Built here rather than carried in from the plan job,
      # whose binary is linux-x64 and would not run on this leg.
      - name: build the release tool (macOS)
        if: ${{ !matrix.container }}
        run: lake build tlrelease

      - name: stage the artifact
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .lake/build/bin/tl "dist/tl-${{ matrix.target }}"
          chmod +x "dist/tl-${{ matrix.target }}"

      # An unsigned macOS download is quarantined by Gatekeeper. An ad-hoc
      # signature does not clear quarantine on its own, but it does keep the
      # binary from being killed outright once the user removes the attribute
      # per the install instructions (ADR-0006 "Runtime prerequisites and
      # signing"; notarization is deferred). Signing changes the bytes, so it
      # happens before anything digests them.
      - name: ad-hoc codesign (macOS)
        if: ${{ !matrix.container }}
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none "dist/tl-${{ matrix.target }}"
          codesign --verify --verbose "dist/tl-${{ matrix.target }}"

      # The floor is a property of the produced binary, so it is asserted on
      # the binary rather than inferred from the base image: a base-image bump
      # that quietly raised the requirement would otherwise ship silently.
      - name: assert the glibc floor (Linux)
        if: matrix.container
        run: |
          set -euo pipefail
          asset="dist/tl-${{ matrix.target }}"
          # `|| true`: with no GLIBC_ symbols, grep exits 1 and pipefail would
          # abort the whole step here — skipping the explanation below, which
          # is the case a reader most needs it for.
          highest=$(readelf --dyn-syms --wide "$asset" \
            | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sed 's/GLIBC_//' | sort -V | tail -1 || true)
          if [ -z "$highest" ]; then
            echo "::error::found no GLIBC_ version references in $asset — either it is statically linked (then delete this check and record why in ADR-0006) or readelf did not read it. Do not publish an unchecked artifact."
            exit 1
          fi
          echo "highest glibc symbol version required: ${highest} (floor ${GLIBC_FLOOR})"
          if [ "$(printf '%s\n%s\n' "$GLIBC_FLOOR" "$highest" | sort -V | tail -1)" != "${GLIBC_FLOOR}" ]; then
            echo "::error::${asset} requires glibc ${highest}, above the ADR-0006 floor of ${GLIBC_FLOOR}. The build image drifted upward: repin GLIBC_FLOOR_IMAGE to an image at or below the floor, or change the floor in ADR-0006 deliberately and update the docs and installer with it."
            exit 1
          fi

      # macOS has no equivalent gate: the minimum OS version is inherited from
      # Lean's own prebuilt libraries rather than chosen here, so it is recorded
      # with the release instead of asserted (ADR-0006 "Build approach").
      - name: record the macOS minimum version
        if: ${{ !matrix.container }}
        run: otool -l "dist/tl-${{ matrix.target }}" | grep -A4 LC_BUILD_VERSION || true

      # Smoke test: the artifact must run, report the provenance this release
      # claims, and complete a real task round-trip. `tl version` alone would
      # pass on a binary that cannot touch a repository.
      #
      # `--as 'done'` is quoted deliberately: unquoted, `done` is the shell's
      # loop keyword, and shellcheck — which actionlint runs over every `run:`
      # block, and which is preinstalled on the GitHub runners though not
      # necessarily on a developer's machine — reads it as one and fails the
      # whole script.
      - name: smoke-test the artifact
        run: |
          set -euo pipefail
          asset="$PWD/dist/tl-${{ matrix.target }}"
          "$asset" version
          "$asset" version --json > version.json
          cat version.json
          jq -e --arg v "${{ needs.stamp.outputs.version }}" --arg c "${{ needs.stamp.outputs.commit }}" '
            .ok == true
            and .data.version == $v
            and .data.build.kind == "clean"
            and .data.build.commit == $c
            and .data.build.dirty == false
            and (.data.build.toolchain | startswith("leanprover/lean4:"))
            and (.data.build.manifestDigest | test("^[0-9a-f]{64}$"))
          ' version.json
          "$asset" help --json | jq -e '.ok == true and (.data.commands | length) > 0' > /dev/null

          scratch=$(mktemp -d)
          cd "$scratch"
          git init -q .
          git config user.email tl-release-smoke@example.invalid
          git config user.name "tl release smoke"
          "$asset" init --json | jq -e '.ok == true' > /dev/null
          id=$(TL_ACTOR=release-smoke "$asset" create "smoke" --json | jq -r '.data.id')
          TL_ACTOR=release-smoke "$asset" claim "$id" --json | jq -e '.data.claim.outcome == "won"' > /dev/null
          TL_ACTOR=release-smoke "$asset" close "$id" --as 'done' --json | jq -e '.ok == true' > /dev/null
          "$asset" ready --json | jq -e '.data.count == 0' > /dev/null
          "$asset" doctor --json | jq -e '.data.healthy == true' > /dev/null
          echo "smoke test passed for ${{ matrix.target }}"

      # The link-time dependency audit ADR-0006 requires, run on the actual
      # candidate rather than inferred from the toolchain. It is what lets a
      # recipient check THIRD-PARTY-LICENSES against the artifact instead of
      # taking the notice on trust — and it is the one drift the license
      # generator cannot see, since a *newly* bundled library appears in the
      # binary without appearing in any manifest.
      - name: audit what this binary links against
        run: |
          set -euo pipefail
          asset="dist/tl-${{ matrix.target }}"
          audit="dist/link-audit-${{ matrix.target }}.txt"

          # The symbol table first, into a file, with `nm`'s own status checked.
          # Written inline as `nm -a "$asset" 2>/dev/null | grep -c " $prefix"
          # || true` this step could not fail: `nm` sent its diagnostic to
          # /dev/null, `grep -c` printed 0 over empty input, and `|| true`
          # swallowed both statuses. The audit then recorded every prefix as 0,
          # and that file is hashed into SHA256SUMS, signed, attested and
          # published — signed evidence asserting this binary links none of GMP,
          # libuv or OpenSSL, produced by a step that never read it.
          symbols="${RUNNER_TEMP}/symbols-${{ matrix.target }}.txt"
          if ! nm -a "$asset" > "$symbols" 2>"$symbols.err"; then
            echo "::error::nm could not read ${asset}, so the link-time dependency audit cannot be produced: $(head -n 3 "$symbols.err" | tr '\n' ' ')"
            echo "::error::This audit is what lets a recipient check THIRD-PARTY-LICENSES against the artifact, and it is published signed. An audit reporting no third-party symbols because nothing could be read is worse than none, so the release stops here rather than publishing it."
            exit 1
          fi
          # A binary with no symbols at all is the same problem wearing a zero:
          # every prefix would count 0 and the audit would look clean.
          if [ ! -s "$symbols" ]; then
            echo "::error::nm read ${asset} and reported no symbols at all. Every prefix below would count zero, which is indistinguishable from a binary that genuinely links none of them — the audit would be signed evidence for a claim nothing established. If the binary is now stripped, that is a deliberate change and this step needs a different source of truth (ADR-0006)."
            exit 1
          fi

          # The symbol *names*, with leading underscores stripped.
          #
          # `nm` prints "<address> <type> <name>", and Mach-O prefixes C symbols
          # with an underscore that ELF does not: the same GMP symbol is
          # `__gmp_allocate_func` on Linux and `___gmp_allocate_func` on macOS.
          # Matching ` __gmp` and ` uv_` against the whole line was therefore
          # written for ELF and matched *nothing at all* on either macOS leg —
          # a local rehearsal of the darwin-arm64 leg found 205 GMP and 222
          # libuv symbols in a binary whose audit reported every component as
          # absent. That audit is signed and published, and ADR-0006 keys
          # THIRD-PARTY-LICENSES off it. Normalising the name and anchoring at
          # its start makes the same prefixes mean the same thing under both
          # object formats.
          names="${RUNNER_TEMP}/symbol-names-${{ matrix.target }}.txt"
          awk '{print $NF}' "$symbols" | sed 's/^_*//' > "$names"

          # Lean's runtime links GMP for arbitrary-precision arithmetic, so a
          # binary reporting none has not been read — which is exactly how this
          # step failed before. If Lean genuinely stops bundling GMP that is a
          # licensing change, and this is where it should be noticed rather
          # than by an entry quietly vanishing from the notice.
          if [ "$(grep -c '^gmp' "$names" || true)" -eq 0 ]; then
            echo "::error::the symbol table of ${asset} names no GMP symbols. Lean's runtime links GMP for arbitrary-precision arithmetic, so this is a symbol table this step failed to read rather than a binary that genuinely links none — and the published audit would tell a recipient that THIRD-PARTY-LICENSES owes no GMP entry. If Lean has stopped bundling GMP, record that in ADR-0006 and change this check deliberately."
            exit 1
          fi

          {
            echo "link-time dependency audit for ${{ matrix.target }}"
            echo "binary:    tl-${{ matrix.target }}"
            echo "sha256:    $(sha256sum "$asset" | cut -d' ' -f1)"
            echo "toolchain: $(cat lean-toolchain)"
            echo
            echo "== dynamically linked libraries =="
            if [ "${{ matrix.container }}" = "true" ]; then
              ldd "$asset" || echo "(ldd reported nothing; a static binary would be a change worth recording in ADR-0006)"
            else
              otool -L "$asset"
            fi
            echo
            echo "== symbols from statically linked third-party components =="
            # GMP and libuv are linked in through the Lean runtime and are the
            # entries ADR-0006's licensing section turns on. OpenSSL is checked
            # too: the v4.32.0 toolchain began bundling it, and the notice owes
            # an entry only if the linker did not dead-strip it.
            #
            # `grep -c` over names that were read successfully: a zero here is
            # a count, not a failure to look. The prefix is normalised the same
            # way the names are, so `__gmp` and `gmp_` mean what they mean on
            # ELF while still matching Mach-O's extra underscore.
            for prefix in __gmp gmp_ uv_ SSL_ EVP_ CRYPTO_; do
              bare=$(printf '%s' "$prefix" | sed 's/^_*//')
              count=$(grep -c "^${bare}" "$names" || true)
              echo "${prefix}*: ${count}"
            done
          } > "$audit"
          cat "$audit"

      # What this leg built, recorded by the leg that built it. The sign job
      # downloads binaries from the artifact store and, until now, signed
      # whatever arrived: nothing carried the digest of the binary that was
      # actually smoke-tested out of the job that tested it. Comparing this
      # there closes the one boundary in the pipeline that had no
      # re-verification.
      #
      # This is also the honest form of build provenance. Attesting per leg
      # would mean granting `id-token: write` to four more jobs, and every job
      # defined inline in this file shares one job_workflow_ref — so each of
      # them could then mint a certificate every verifier accepts. The evidence
      # travels instead of the capability.
      - name: record what this leg built
        run: |
          set -euo pipefail
          # Every value named at the call site, and none of them read out of the
          # environment by the tool itself. An unset variable read into a string
          # is indistinguishable from an empty one, and that is precisely how
          # the workflow-ref comparison downstream used to disable itself
          # instead of failing: `if workflow_ref and ...` was "always compare"
          # to its author and "never compare" wherever the variable was unset.
          # Passed as arguments, an absent value is a usage error before
          # anything is written.
          ./.lake/build/bin/tlrelease build-metadata \
            --target "${{ matrix.target }}" \
            --binary "dist/tl-${{ matrix.target }}" \
            --commit "${{ needs.stamp.outputs.commit }}" \
            --tier "${{ matrix.best_effort && 'best-effort' || 'supported' }}" \
            --runner "${{ matrix.runs-on }}" \
            --toolchain lean-toolchain \
            --lake-manifest lake-manifest.json \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --runner-os "${RUNNER_OS}" \
            --runner-arch "${RUNNER_ARCH}" \
            --container-image "${CONTAINER_IMAGE}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output-dir dist \
            --output "build-metadata-${{ matrix.target }}.json"
          cat "dist/build-metadata-${{ matrix.target }}.json"
        env:
          CONTAINER_IMAGE: ${{ matrix.container && env.GLIBC_FLOOR_IMAGE || '' }}

      - name: upload the release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.target }}
          path: |
            dist/tl-${{ matrix.target }}
            dist/build-metadata-${{ matrix.target }}.json
            dist/link-audit-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Sign, attest, verify, publish.
  #
  # Keyless: the signing key is ephemeral and the certificate binds this
  # workflow's OIDC identity, so there is no long-lived secret to steal. That
  # only means something if verifiers pin the identity, which is what
  # release/identity.json is for — and why this job refuses to sign at all
  # unless its own identity matches that pin.
  #
  # Pushed tags only. A workflow_dispatch rehearsal produces artifacts and
  # stops: its certificate would name a branch ref, which no verifier accepts,
  # so signing one would only manufacture unverifiable files.
  #
  # Both halves of that condition are load-bearing. `ref_type == 'tag'` alone is
  # satisfied by a dispatch against a tag ref, and by any trigger added later
  # that can name one; the `stamp` job refuses that combination, but a rehearsal
  # should be *incapable* of signing rather than dependent on an upstream job
  # having refused first. Requiring the push event as well is what makes every
  # privileged job below unreachable from a trigger nobody has thought about
  # yet — which is the property a rehearsal needs before it is worth running.
  # ---------------------------------------------------------------------------
  sign:
    needs: [gates, stamp, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: download the release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-candidate-*
          merge-multiple: true
          path: dist

      - name: download the release tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tool
          path: tool

      - name: refuse a missing or changed release tool
        if: needs.gates.outputs.releaseToolFileSetHash == '' || hashFiles('tool/tlrelease') == '' || needs.gates.outputs.releaseToolFileSetHash != hashFiles('tool/tlrelease')
        run: /usr/bin/false

      - name: make the validated release tool executable
        run: /bin/chmod 0755 tool/tlrelease

      - name: enter the validated release tool
        run: ./tool/tlrelease --help

      - name: validate the release identity
        run: ./tool/tlrelease identity-check --identity release/identity.json

      - name: the checkout, protected main and tag agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.stamp.outputs.commit }}
        run: ./tool/tlrelease workflow-source --identity release/identity.json --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

      - name: this job's identity matches the pin
        env:
          CERTIFICATE_SAN: https://github.com/${{ github.workflow_ref }}
        run: ./tool/tlrelease identity-accepts --identity release/identity.json --san "$CERTIFICATE_SAN"

      - name: the signing pin remains canonical
        run: ./tool/tlrelease identity-check --identity release/identity.json

      - name: the external prerequisites are in place
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tool/tlrelease prereqs --identity release/identity.json --plan release/plan.json

      - name: assemble and describe the release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.stamp.outputs.commit }}
          RELEASE_WORKFLOW: ${{ github.workflow_ref }}
          RELEASE_RUN: ${{ github.run_id }}
        run: ./tool/tlrelease workflow-prepare --dist dist --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --workflow-ref "$RELEASE_WORKFLOW" --run-id "$RELEASE_RUN"

      - name: sign the exact set and emit attestation subjects
        id: subjects
        run: ./tool/tlrelease workflow-sign --dist dist --output "$GITHUB_OUTPUT"

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

      - name: verify every candidate before handing it off
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.stamp.outputs.commit }}
        run: ./tool/tlrelease workflow-verify --dist dist --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

      - name: upload the signed release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tl-signed-release
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: [gates, stamp, sign]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: download the signed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tl-signed-release
          path: dist

      - name: download the release tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tool
          path: tool

      - name: refuse a missing or changed release tool
        if: needs.gates.outputs.releaseToolFileSetHash == '' || hashFiles('tool/tlrelease') == '' || needs.gates.outputs.releaseToolFileSetHash != hashFiles('tool/tlrelease')
        run: /usr/bin/false

      - name: make the validated release tool executable
        run: /bin/chmod 0755 tool/tlrelease

      - name: enter the validated release tool
        run: ./tool/tlrelease --help

      - name: validate the release identity
        run: ./tool/tlrelease identity-check --identity release/identity.json

      - name: authenticate, recheck source, and publish the release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.stamp.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: ./tool/tlrelease workflow-publish --dist dist --identity release/identity.json --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

  publish-homebrew:
    needs: [gates, stamp, publish-release]
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag'
      && needs.gates.outputs.homebrew == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: download the signed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tl-signed-release
          path: dist

      - name: download the release tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tool
          path: tool

      - name: refuse a missing or changed release tool
        if: needs.gates.outputs.releaseToolFileSetHash == '' || hashFiles('tool/tlrelease') == '' || needs.gates.outputs.releaseToolFileSetHash != hashFiles('tool/tlrelease')
        run: /usr/bin/false

      - name: make the validated release tool executable
        run: /bin/chmod 0755 tool/tlrelease

      - name: enter the validated release tool
        run: ./tool/tlrelease --help

      - name: validate the release identity
        run: ./tool/tlrelease identity-check --identity release/identity.json

      - name: authenticate, render, and publish the formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.stamp.outputs.commit }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./tool/tlrelease workflow-homebrew --dist dist --output-dir out --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

      - name: upload the rendered formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tl-homebrew-formula
          path: out/tl.rb
          if-no-files-found: error

  publish-npm:
    needs: [gates, stamp, publish-release]
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag'
      && needs.gates.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: install the pinned npm CLI
        run: npm install -g --ignore-scripts npm@11.5.1

      - name: download the signed assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tl-signed-release
          path: dist

      - name: download the release tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tool
          path: tool

      - name: refuse a missing or changed release tool
        if: needs.gates.outputs.releaseToolFileSetHash == '' || hashFiles('tool/tlrelease') == '' || needs.gates.outputs.releaseToolFileSetHash != hashFiles('tool/tlrelease')
        run: /usr/bin/false

      - name: make the validated release tool executable
        run: /bin/chmod 0755 tool/tlrelease

      - name: enter the validated release tool
        run: ./tool/tlrelease --help

      - name: validate the release identity
        run: ./tool/tlrelease identity-check --identity release/identity.json

      - name: authenticate the received release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.stamp.outputs.commit }}
        run: ./tool/tlrelease workflow-verify --dist dist --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

      - name: stage the npm packages around the signed binaries
        run: ./tool/tlrelease npm-stage --root . --dist dist --manifest dist/release-manifest.json --staging npm-staging

      - name: publish
        run: ./tool/tlrelease npm-publish --staging npm-staging --manifest dist/release-manifest.json
