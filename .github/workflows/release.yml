# Release pipeline for tl — native artifacts on a SemVer tag.
#
# This workflow path is part of the signing identity: GitHub's OIDC certificate
# names the workflow that requested it, and `release/identity.json` pins that
# name. Signing therefore runs *directly here* rather than in a reusable
# workflow, which would change the certificate's `job_workflow_ref` and break
# the pin every verifier checks (ADR-0006 "Release integrity and provenance").
# Renaming or moving this file is an identity rotation, not a refactor: see the
# rotation procedure in VERIFYING.md.
#
# The correctness gates themselves live in ci.yml and AGENTS.md; this workflow
# re-runs them against the tagged commit rather than trusting that the tag
# happens to point at a commit CI already saw.
name: Release

on:
  push:
    tags:
      # A coarse filter only. GitHub's tag globs have no alternation and no
      # repetition bounds, so they cannot express SemVer — `v01.0.0` and
      # `v1.2.3-` both match these. The stamp job re-checks the tag against
      # the pinned certificate identity expression before anything is built,
      # which is where a tag the signing identity would later reject gets
      # rejected instead of after a full matrix run.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # A build-only rehearsal: everything up to and including the artifacts and
  # their smoke tests, with no signing and no GitHub Release. Useful for
  # exercising the matrix before committing to a tag, and safe because a
  # non-tag run could not produce a certificate identity that verifies anyway.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The Linux artifacts are built inside this image so they inherit its glibc
  # rather than the runner's. Ubuntu 18.04 carries glibc 2.27, the floor
  # ADR-0006 documents (Lean's own floors are 2.26 on x86-64 and 2.27 on
  # aarch64). Pinned by multi-arch index digest, so both Linux legs resolve the
  # same published image and a moved tag cannot change what we build against.
  GLIBC_FLOOR_IMAGE: "ubuntu@sha256:152dc042452c496007f07ca9127571cb9c29697f42acbfad72324b2bb2e43c98"
  GLIBC_FLOOR: "2.27"
  # elan installs the pinned Lean toolchain inside that image, where the
  # node-based setup actions cannot run. Hash-pinned like the floor-git tarball
  # in ci.yml: the download is checked before it is executed. The per-target
  # digests are in the build matrix, next to the triple they belong to.
  ELAN_VERSION: "v4.2.3"

jobs:
  # ---------------------------------------------------------------------------
  # 1. The correctness gates, on the exact commit being released.
  # ---------------------------------------------------------------------------
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: task-id lint selftest
        run: ./scripts/check-task-ids.sh --selftest
      - name: task-id leakage
        run: ./scripts/check-task-ids.sh

      - name: install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl -sSfL --retry 3 -o "$tmp/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp" actionlint
          install -m 0755 "$tmp/actionlint" /usr/local/bin/actionlint

      # The same command ci.yml runs, against the commit actually being
      # released, plus the tag-agreement check that only makes sense here. This
      # job used to run four of the policy's gates and describe itself as
      # running them all, so the installer, the artifact verifier, the npm
      # packages and the formula were never exercised on the tagged commit —
      # the one commit where a stale gate becomes a published artifact.
      #
      # --strict: in CI a missing tool is a broken job, not a smaller policy.
      - name: release policy, on the tagged commit
        run: ./scripts/check-release-policy.sh --strict --tag "${GITHUB_REF_NAME}"
        if: github.ref_type == 'tag'
      - name: release policy
        run: ./scripts/check-release-policy.sh --strict
        if: github.ref_type != 'tag'

      # Restore-only. ci.yml's policy is that only protected main saves the
      # shared caches; a tag build consumes them and saves nothing.
      - name: restore mathlib olean archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mathlib
          key: trusted-main-v1-mathlib-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: build (lake build --wfail)
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "true"
          build-args: "--wfail"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"

      - name: build trust verifier warning-free
        run: lake build tlverify --wfail
      - name: trust boundary (lake exe tlverify)
        run: lake exe tlverify
      - name: test (lake exe tltest)
        run: lake exe tltest

  # ---------------------------------------------------------------------------
  # 2. One build stamp for the whole matrix.
  #
  # Every artifact must report the same source commit and dependency identity.
  # Generating the stamp once and shipping it to each leg makes that true by
  # construction, instead of relying on four independent runs of the generator
  # agreeing.
  # ---------------------------------------------------------------------------
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      commit: ${{ steps.stamp.outputs.commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The tag glob that triggered this run cannot express SemVer, and the
      # signing identity can. Checking the tag against the pin here — before
      # the build matrix — turns "four platform builds, then an unsignable
      # artifact" into an immediate refusal.
      - name: the tag is one the signing identity will accept
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          san="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          python3 - "$san" "${GITHUB_REF_NAME}" <<'PY'
          import json, re, sys
          san, tag = sys.argv[1], sys.argv[2]
          pin = json.load(open("release/identity.json"))
          if re.search(pin["certificateIdentityRegexp"], san) is None:
              sys.exit(
                  f"::error::tag {tag!r} is outside the SemVer shape release/identity.json accepts, "
                  "so nothing built from it could be signed with an identity any verifier would "
                  "accept. Delete the tag and re-tag as vMAJOR.MINOR.PATCH (no leading zeroes), "
                  "optionally with a -prerelease suffix of dot-separated alphanumerics."
              )
          print(f"tag {tag} is acceptable to the pinned signing identity")
          PY

      # A dispatch run against a tag ref would otherwise satisfy every
      # `ref_type == 'tag'` guard below and perform a real release, which is
      # not what the rehearsal path advertises.
      - name: a rehearsal is not a release
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
        run: |
          echo "::error::this workflow was dispatched against the tag ${GITHUB_REF_NAME}. A dispatch run is a build-only rehearsal; dispatching a tag ref would sign and publish for real. Push the tag to release, or dispatch against a branch to rehearse."
          exit 1

      - name: stamp the tagged commit
        id: stamp
        run: |
          set -euo pipefail
          # The product version the binary will report, from the one place that
          # defines it.
          version=$(sed -n 's/^def productVersion : String := "\(.*\)"$/\1/p' Tl/Cli/Commands.lean)
          if [ -z "$version" ]; then
            echo "::error::could not read productVersion from Tl/Cli/Commands.lean — the definition moved or changed shape. Update this step to match it; the tag-vs-version check below depends on it."
            exit 1
          fi

          # On a tag, the tag and the compiled version must agree. They are
          # edited in different commits by different hands, and a mismatch
          # would ship a binary whose self-reported version contradicts the
          # release it is published under.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match productVersion '${version}' in Tl/Cli/Commands.lean. Bump productVersion (and the lakefile package version) to ${tag_version} and re-tag, or tag v${version} instead."
              exit 1
            fi
          fi

          ./scripts/gen-build-provenance.sh --stamp

          commit=$(git rev-parse HEAD)
          # A fresh checkout is clean; a dirty stamp means something wrote into
          # the tree before this step, and the artifacts would not correspond
          # to the tagged source.
          if grep -q 'stampDirty : Bool := true' Tl/Build/Stamp.lean; then
            echo "::error::the stamped checkout is dirty — something modified the working tree before stamping. Release artifacts must correspond exactly to the tagged commit; find and remove the step that writes into the checkout."
            exit 1
          fi
          if ! grep -q "stampCommit : String := \"${commit}\"" Tl/Build/Stamp.lean; then
            echo "::error::the generated stamp does not carry HEAD (${commit}) — scripts/gen-build-provenance.sh did not stamp what this job checked out."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          cat Tl/Build/Stamp.lean

      - name: upload the stamp
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tl-build-stamp
          path: Tl/Build/Stamp.lean
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3. The four native artifacts.
  #
  # Native per target: Lean cross-compiles poorly, so each artifact is built on
  # its own architecture and operating system (ADR-0006 "Build approach").
  # ---------------------------------------------------------------------------
  build:
    needs: [gates, stamp]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-latest
            container: true
            best_effort: false
            elan_triple: x86_64-unknown-linux-gnu
            elan_sha256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            container: true
            best_effort: false
            elan_triple: aarch64-unknown-linux-gnu
            elan_sha256: cb69af0803b04157bc30201c29c12fca882bb3ad8b43476b8d2d3064810bc3ac
          - target: darwin-arm64
            runs-on: macos-15
            container: false
            best_effort: false
          # macOS x86-64 is Lean Tier 2 and our Best-effort tier: smoke-tested,
          # not release-blocking (ADR-0006). `fail-fast: false` alone would not
          # deliver that — it lets the other legs finish, but a failed leg still
          # fails the matrix job and blocks the downstream signing job.
          # `continue-on-error` is what actually makes this leg non-blocking;
          # the sign job then checks which artifacts arrived, so a missing
          # best-effort binary is reported rather than silently omitted, and a
          # missing Supported one still stops the release. macos-15-intel is
          # the last x86-64 macOS image GitHub offers.
          - target: darwin-x64
            runs-on: macos-15-intel
            container: false
            best_effort: true
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ matrix.best_effort }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: download the stamp
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tl-build-stamp
          path: Tl/Build

      - name: confirm the shared stamp landed
        run: |
          set -euo pipefail
          if ! grep -q "stampCommit : String := \"${{ needs.stamp.outputs.commit }}\"" Tl/Build/Stamp.lean; then
            echo "::error::this leg's Tl/Build/Stamp.lean is not the stamp job's artifact — the download step overwrote the wrong path, or the artifact is stale. Every leg must compile the same stamp."
            exit 1
          fi

      - name: restore mathlib olean archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mathlib
          key: trusted-main-v1-mathlib-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      # --- Linux: build inside the glibc-floor image ---------------------------
      #
      # The node-based setup actions cannot run in an image this old, so the
      # whole build is one `docker run`: install elan from a hash-pinned
      # tarball, fetch the mathlib olean cache, build the binary. The host's
      # ~/.cache/mathlib is mounted in so the restore above is not wasted.
      - name: build inside the glibc ${{ env.GLIBC_FLOOR }} image
        if: matrix.container
        env:
          ELAN_SHA256: ${{ matrix.elan_sha256 }}
          ELAN_TRIPLE: ${{ matrix.elan_triple }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/mathlib"
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$HOME/.cache/mathlib:/root/.cache/mathlib" \
            -e ELAN_VERSION="${ELAN_VERSION}" \
            -e ELAN_SHA256="${ELAN_SHA256}" \
            -e ELAN_TRIPLE="${ELAN_TRIPLE}" \
            "${GLIBC_FLOOR_IMAGE}" \
            bash -euo pipefail -c '
              # No sources rewrite. 18.04 is past end of standard support but
              # has not moved to old-releases: archive.ubuntu.com,
              # security.ubuntu.com and ports.ubuntu.com (the arm64 archive)
              # all still serve bionic, while old-releases returns 404 for it.
              # Rewriting to old-releases would break both Linux legs, and an
              # arm64-blind rewrite would miss ports.ubuntu.com entirely.
              apt-get update -q
              apt-get install -y -q --no-install-recommends \
                ca-certificates curl git gcc libc6-dev make xz-utils
              # The checkout is owned by the runner user, not root.
              git config --global --add safe.directory /src

              tmp=$(mktemp -d)
              curl -sSfL --retry 3 -o "$tmp/elan.tar.gz" \
                "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-${ELAN_TRIPLE}.tar.gz"
              echo "${ELAN_SHA256}  $tmp/elan.tar.gz" | sha256sum -c -
              tar -xzf "$tmp/elan.tar.gz" -C "$tmp"
              "$tmp/elan-init" -y --default-toolchain none >/dev/null
              export PATH="/root/.elan/bin:$PATH"
              elan toolchain install "$(cat lean-toolchain)"
              elan override set "$(cat lean-toolchain)"

              # Prebuilt mathlib oleans. `cache get` does not fail on a miss,
              # it just leaves the oleans to be built from source — which takes
              # hours rather than minutes, so a miss is worth naming in the log
              # even though it is not fatal.
              lake exe cache get 2>&1 | tee /tmp/cache-get.log
              if grep -qi "not found\|no such file" /tmp/cache-get.log; then
                echo "::warning::the mathlib olean cache did not cover this toolchain/manifest pair — this leg is building mathlib from source and will take hours. Check that the pinned revisions in lake-manifest.json have published caches."
              fi
              lake build tl
            '
          # The container wrote as root; hand both trees back so later steps and
          # the runner cleanup can touch them.
          sudo chown -R "$(id -u):$(id -g)" .lake "$HOME/.cache/mathlib"

      # --- macOS: build on the runner -----------------------------------------
      - name: build (macOS)
        if: ${{ !matrix.container }}
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "true"
          build-args: "tl"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"

      - name: stage the artifact
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .lake/build/bin/tl "dist/tl-${{ matrix.target }}"
          chmod +x "dist/tl-${{ matrix.target }}"
          echo "asset=tl-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      # An unsigned macOS download is quarantined by Gatekeeper. An ad-hoc
      # signature does not clear quarantine on its own, but it does keep the
      # binary from being killed outright once the user removes the attribute
      # per the install instructions (ADR-0006 "Runtime prerequisites and
      # signing"; notarization is deferred). Signing changes the bytes, so it
      # happens before anything digests them.
      - name: ad-hoc codesign (macOS)
        if: ${{ !matrix.container }}
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none "dist/${{ steps.stage.outputs.asset }}"
          codesign --verify --verbose "dist/${{ steps.stage.outputs.asset }}"

      # The floor is a property of the produced binary, so it is asserted on
      # the binary rather than inferred from the base image: a base-image bump
      # that quietly raised the requirement would otherwise ship silently.
      - name: assert the glibc floor (Linux)
        if: matrix.container
        run: |
          set -euo pipefail
          asset="dist/${{ steps.stage.outputs.asset }}"
          # `|| true`: with no GLIBC_ symbols, grep exits 1 and pipefail would
          # abort the whole step here — skipping the explanation below, which
          # is the case a reader most needs it for.
          highest=$(readelf --dyn-syms --wide "$asset" \
            | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sed 's/GLIBC_//' | sort -V | tail -1 || true)
          if [ -z "$highest" ]; then
            echo "::error::found no GLIBC_ version references in $asset — either it is statically linked (then delete this check and record why in ADR-0006) or readelf did not read it. Do not publish an unchecked artifact."
            exit 1
          fi
          echo "highest glibc symbol version required: ${highest} (floor ${GLIBC_FLOOR})"
          if [ "$(printf '%s\n%s\n' "$GLIBC_FLOOR" "$highest" | sort -V | tail -1)" != "${GLIBC_FLOOR}" ]; then
            echo "::error::${asset} requires glibc ${highest}, above the ADR-0006 floor of ${GLIBC_FLOOR}. The build image drifted upward: repin GLIBC_FLOOR_IMAGE to an image at or below the floor, or change the floor in ADR-0006 deliberately and update the docs and installer with it."
            exit 1
          fi

      # macOS has no equivalent gate: the minimum OS version is inherited from
      # Lean's own prebuilt libraries rather than chosen here, so it is recorded
      # with the release instead of asserted (ADR-0006 "Build approach").
      - name: record the macOS minimum version
        if: ${{ !matrix.container }}
        run: otool -l "dist/${{ steps.stage.outputs.asset }}" | grep -A4 LC_BUILD_VERSION || true

      # Smoke test: the artifact must run, report the provenance this release
      # claims, and complete a real task round-trip. `tl version` alone would
      # pass on a binary that cannot touch a repository.
      #
      # `--as 'done'` is quoted deliberately: unquoted, `done` is the shell's
      # loop keyword, and shellcheck — which actionlint runs over every `run:`
      # block, and which is preinstalled on the GitHub runners though not
      # necessarily on a developer's machine — reads it as one and fails the
      # whole script.
      - name: smoke-test the artifact
        run: |
          set -euo pipefail
          asset="$PWD/dist/${{ steps.stage.outputs.asset }}"
          "$asset" version
          "$asset" version --json > version.json
          cat version.json
          jq -e --arg v "${{ needs.stamp.outputs.version }}" --arg c "${{ needs.stamp.outputs.commit }}" '
            .ok == true
            and .data.version == $v
            and .data.build.kind == "clean"
            and .data.build.commit == $c
            and .data.build.dirty == false
            and (.data.build.toolchain | startswith("leanprover/lean4:"))
            and (.data.build.manifestDigest | test("^[0-9a-f]{64}$"))
          ' version.json
          "$asset" help --json | jq -e '.ok == true and (.data.commands | length) > 0' > /dev/null

          scratch=$(mktemp -d)
          cd "$scratch"
          git init -q .
          git config user.email tl-release-smoke@example.invalid
          git config user.name "tl release smoke"
          "$asset" init --json | jq -e '.ok == true' > /dev/null
          id=$(TL_ACTOR=release-smoke "$asset" create "smoke" --json | jq -r '.data.id')
          TL_ACTOR=release-smoke "$asset" claim "$id" --json | jq -e '.data.claim.outcome == "won"' > /dev/null
          TL_ACTOR=release-smoke "$asset" close "$id" --as 'done' --json | jq -e '.ok == true' > /dev/null
          "$asset" ready --json | jq -e '.data.count == 0' > /dev/null
          "$asset" doctor --json | jq -e '.data.healthy == true' > /dev/null
          echo "smoke test passed for ${{ matrix.target }}"

      - name: upload the release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.target }}
          path: dist/${{ steps.stage.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Sign, attest, verify, publish.
  #
  # Keyless: the signing key is ephemeral and the certificate binds this
  # workflow's OIDC identity, so there is no long-lived secret to steal. That
  # only means something if verifiers pin the identity, which is what
  # release/identity.json is for — and why this job refuses to sign at all
  # unless its own identity matches that pin.
  #
  # Tag runs only. A workflow_dispatch rehearsal produces artifacts and stops:
  # its certificate would name a branch ref, which no verifier accepts, so
  # signing one would only manufacture unverifiable files.
  # ---------------------------------------------------------------------------
  sign:
    needs: [stamp, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A named environment so the signing identity is not simply whatever a tag
    # push claims. Pushing a tag is not by itself authorization to sign: this
    # workflow will produce a certificate that every verifier accepts, for
    # whatever commit the tag points at. Configure required reviewers and a
    # `v*` deployment-branch/tag rule on this environment, and protect `v*`
    # tags with a repository ruleset — the ancestry check below is a backstop,
    # not a substitute, because it only sees what the tag points at and not who
    # pushed it.
    environment: release
    permissions:
      # Only what this job does: mint the OIDC token and record attestations.
      # Deliberately *not* contents: write — creating the release is a separate
      # job below, so the step that can mint a signing identity every verifier
      # trusts cannot also publish, and the step that can publish cannot sign.
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The ancestry check below needs history, not just the tagged commit.
          fetch-depth: 0

      # A tag can be pushed at any commit, including one that never passed
      # review. Releases come from the protected branch; anything else is
      # either a mistake or someone routing around review.
      - name: the tagged commit is on main
        run: |
          set -euo pipefail
          commit="${{ needs.stamp.outputs.commit }}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::${commit} is not an ancestor of origin/main, so this tag points at a commit that is not on the protected branch. Release from main: merge the work first, then tag the merged commit. If this is deliberate, say so explicitly by changing this check rather than by deleting it."
            exit 1
          fi
          echo "${commit} is on origin/main"

      # The tag must still point where the build thought it did. A tag that is
      # deleted mid-run makes `gh release create` invent one from the default
      # branch; a tag that is moved would publish artifacts built from a
      # different commit than the release names.
      - name: the tag still points at the built commit
        run: |
          set -euo pipefail
          expected="${{ needs.stamp.outputs.commit }}"
          # ^{} peels an annotated tag to the commit it wraps.
          actual=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
                     "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f1)
          if [ -z "$actual" ]; then
            actual=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
                       "refs/tags/${GITHUB_REF_NAME}" | cut -f1)
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} now points at '${actual:-<deleted>}' but these artifacts were built from ${expected}. The tag moved or was deleted during the build. Nothing is published; re-tag deliberately and re-run, so the release cannot name a commit it does not contain."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} still points at ${expected}"

      - name: download the release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-candidate-*
          merge-multiple: true
          path: dist

      # Before anything is signed: does the identity this job will actually
      # present match the one every verifier is pinned to? GITHUB_WORKFLOW_REF
      # is what Fulcio puts in the certificate's SAN, prefixed with the GitHub
      # URL. A mismatch here means the artifacts would be unverifiable — which
      # is worse than not shipping them, because a signature nobody can check
      # still looks like one.
      - name: this job's identity matches the pin
        run: |
          set -euo pipefail
          san="https://github.com/${GITHUB_WORKFLOW_REF}"
          echo "certificate identity this job will present: ${san}"
          python3 - "$san" <<'PY'
          import json, re, sys
          san = sys.argv[1]
          pin = json.load(open("release/identity.json"))
          if re.search(pin["certificateIdentityRegexp"], san) is None:
              sys.exit(
                  f"::error::this job will sign as {san!r}, which release/identity.json does not "
                  "accept. Every verifier — VERIFYING.md, the installer, the Homebrew formula — is "
                  "pinned to that expression, so these artifacts would be unverifiable. Either the "
                  "workflow moved (that is an identity rotation: follow the procedure in "
                  "VERIFYING.md) or the tag is outside the accepted SemVer shape."
              )
          print("identity matches the pin")
          PY

      - name: the pin itself still discriminates
        run: |
          ./scripts/check-release-identity.sh --selftest
          ./scripts/check-release-identity.sh

      # The external state this pipeline depends on, audited before anything is
      # signed: the five npm packages must exist (trusted publishing is
      # configured per package and only for one that already does, so the first
      # release cannot authenticate otherwise), the `release` environment must
      # carry protection rules, and the tap must exist. None of that is created
      # by declaring it in this file, and until now none of it was checked —
      # the first tag would have published GitHub assets and then failed at
      # npm, with the artifacts already public.
      #
      # Rows the runner's token cannot read are reported as unchecked rather
      # than passed, and carried as assumptions in docs/overview.md.
      - name: the external prerequisites are in place
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-prereqs.sh

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The best-effort leg is allowed to fail, so this job cannot assume four
      # artifacts. It can and does insist on the Supported three: a release
      # missing one of those is a broken release, whereas a release missing the
      # best-effort binary is the policy working. Either way the outcome is
      # stated rather than inferred from what happens to be in the directory.
      - name: check which targets produced an artifact
        run: |
          set -euo pipefail
          # Target names, not asset names: the asset name is built from the
          # target below. Spelling `tl-<target>` out here would read as a task
          # id to the AGENTS.md lint, which cannot tell the two apart.
          required="linux-x64 linux-arm64 darwin-arm64"
          optional="darwin-x64"
          missing=""
          for target in $required; do
            [ -f "dist/tl-$target" ] || missing="$missing tl-$target"
          done
          if [ -n "$missing" ]; then
            echo "::error::these Supported-tier artifacts are missing:${missing}. They are release-blocking (ADR-0006) — fix the failing build leg and re-run; do not publish a partial release."
            exit 1
          fi
          for target in $optional; do
            if [ ! -f "dist/tl-$target" ]; then
              echo "::warning::tl-${target} is absent — its build leg failed. macOS x86-64 is Best-effort (ADR-0006), so the release proceeds without it; users on that platform get no binary from this release."
            fi
          done
          ls -l dist

      - name: build SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # Sorted by name so the file is byte-stable across runs regardless of
          # the order artifacts happened to download in.
          find . -maxdepth 1 -type f -name 'tl-*' ! -name '*.sigstore.json' -printf '%f\n' \
            | sort > ../asset-names
          if [ ! -s ../asset-names ]; then
            echo "::error::no candidate assets were downloaded — the build matrix produced nothing to sign. Check the upload-artifact steps in the build job."
            exit 1
          fi
          xargs sha256sum < ../asset-names > SHA256SUMS
          cat SHA256SUMS

      # The sums file and every asset get their own bundle: signature,
      # certificate, and Rekor inclusion proof in one file. A verifier needs
      # the proof *in* the bundle — repairing a missing one with a live log
      # lookup would rebind the artifact to whatever the log says now.
      - name: sign the sums file and every asset
        working-directory: dist
        run: |
          set -euo pipefail
          cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.sigstore.json
          while read -r asset; do
            cosign sign-blob --yes "$asset" --bundle "${asset}.sigstore.json"
          done < ../asset-names

      # GitHub's own attestation, binding each artifact to this workflow, the
      # source commit, and the build. Complementary to the Sigstore bundles
      # rather than a substitute: it is verified with `gh attestation verify`
      # against the repository, whereas the bundles are verified offline
      # against a pinned certificate identity by users who may have neither
      # `gh` nor a GitHub account.
      # Driven from asset-names, not from `dist/tl-*`: by this point the
      # directory also holds `tl-<target>.sigstore.json`, and a glob would
      # attest the bundles alongside the binaries.
      - name: list the binaries to attest
        id: subjects
        run: |
          set -euo pipefail
          {
            echo 'paths<<SUBJECTS'
            sed 's|^|dist/|' asset-names
            echo 'SUBJECTS'
          } >> "$GITHUB_OUTPUT"

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

      # The published procedure, run against the candidates, before anyone can
      # download them. If VERIFYING.md's instructions would reject these files,
      # they do not get released.
      - name: verify every candidate the way VERIFYING.md tells users to
        run: |
          set -euo pipefail
          ./scripts/verify-release-artifacts.sh --selftest
          # shellcheck disable=SC2046
          ./scripts/verify-release-artifacts.sh --require-signature dist $(cat asset-names)

      # The signed set travels to the publishing job as one artifact, so the
      # job that creates the release never holds an OIDC token and cannot mint
      # a signature of its own.
      - name: upload the signed release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tl-signed-release
          path: |
            dist
            asset-names
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4b. Publish the GitHub Release.
  #
  # Split from signing for least privilege: this job writes to the repository
  # but has no OIDC token, so it cannot produce a certificate any verifier
  # would accept. It re-runs the published verification procedure on what it
  # received, because "the previous job checked it" is an assumption, and the
  # artifact boundary is exactly where an assumption should be re-established.
  # ---------------------------------------------------------------------------
  publish-release:
    needs: [stamp, sign]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: download the signed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tl-signed-release

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: verify what arrived, before publishing it
        run: |
          set -euo pipefail
          ./scripts/verify-release-artifacts.sh --selftest
          # shellcheck disable=SC2046
          ./scripts/verify-release-artifacts.sh --require-signature dist $(cat asset-names)

      - name: the tag still points at the built commit
        run: |
          set -euo pipefail
          expected="${{ needs.stamp.outputs.commit }}"
          actual=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
                     "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f1)
          if [ -z "$actual" ]; then
            actual=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
                       "refs/tags/${GITHUB_REF_NAME}" | cut -f1)
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} now points at '${actual:-<deleted>}' but these artifacts were built from ${expected}. The tag moved or was deleted. Nothing is published; re-tag deliberately and re-run."
            exit 1
          fi

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          {
            echo "Built from \`${{ needs.stamp.outputs.commit }}\` with \`$(cat lean-toolchain)\`."
            echo
            echo "Verify before running — see [VERIFYING.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/VERIFYING.md)."
            echo "Every asset has a Sigstore bundle; \`SHA256SUMS\` is signed as well, and is what the digests are checked against."
          } > "$notes"
          # --verify-tag: without it, gh creates a tag from the default branch
          # when the named one is missing, quietly turning "the tag vanished"
          # into "a release exists for a commit nobody tagged".
          # An explicit array rather than an unquoted command substitution.
          # actionlint runs every `run:` block through shellcheck, and the
          # inline `$(if …)` form was the one place in this file that tripped
          # SC2046 without a disable directive — so the workflow lint would
          # have failed on the commit that introduced it.
          prerelease=()
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            "${prerelease[@]}" \
            dist/*

  # ---------------------------------------------------------------------------
  # 4c. Homebrew.
  #
  # The formula pins each asset's SHA-256, so it can only be written once the
  # release exists and its sums file has been verified. It is pushed to the tap
  # repository, which is the distribution point; the source of truth stays here,
  # beside release/identity.json, so the identity drift guard can see it.
  # ---------------------------------------------------------------------------
  publish-homebrew:
    needs: [stamp, publish-release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: download the signed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tl-signed-release

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Every digest the formula pins is copied out of SHA256SUMS on trust, so
      # that file's signature is checked first.
      - name: verify the sums file before copying digests out of it
        run: |
          set -euo pipefail
          # The selftest first, like every other consumer of the signed set: a
          # verifier that has stopped refusing would otherwise be trusted here
          # on the strength of having exited zero.
          ./scripts/verify-release-artifacts.sh --selftest
          # shellcheck disable=SC2046
          ./scripts/verify-release-artifacts.sh --require-signature dist $(cat asset-names)

      # A stable tag must not reach this job without somewhere to push. The
      # token is checked *before* the formula is generated, so a missing
      # credential fails while nothing has been produced that a maintainer
      # might mistake for a published one. `secrets` is not available in a step
      # `if:`, so the token is read into the environment and the step decides.
      #
      # This used to warn and exit 0 further down, which meant a green stable
      # release did not imply the Homebrew channel it promises had been
      # updated. A channel this pipeline advertises is either updated or the
      # release says it failed; "published, except for the part nobody
      # noticed" is not an outcome worth having.
      - name: a stable release must be able to reach the tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not configured, so this stable release cannot update DmitryKorolev/homebrew-tap — and ADR-0006 lists Homebrew as a published channel. Add the secret (a token with write access to the tap repository) and re-run this job. To release without the Homebrew channel deliberately, remove it from ADR-0006 in the same change rather than letting the push fail quietly."
            exit 1
          fi
          echo "the tap credential is present"

      - name: generate the formula
        run: |
          set -euo pipefail
          ./scripts/gen-homebrew-formula.sh --selftest
          ./scripts/gen-homebrew-formula.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS Formula/tl.rb
          cat Formula/tl.rb

      # Deliberately not `if: always()`. The checkout's Formula/tl.rb is the
      # placeholder template until the step above rewrites it, so on any earlier
      # failure `always()` attached that template under the same artifact name a
      # good formula uses — `version "0.0.0"`, four all-zero digests, and
      # `if-no-files-found: error` satisfied. The comment below tells a
      # maintainer this artifact exists so the tap can be updated by hand, and
      # following that instruction with the placeholder publishes a formula
      # whose urls point at a release that does not exist.
      - name: upload the generated formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tl-homebrew-formula
          path: Formula/tl.rb
          if-no-files-found: error

      # A tap carries one formula, so pushing a prerelease would make
      # `brew install tl` resolve to it. The formula is still generated and
      # uploaded above; only the push is skipped.
      - name: push the formula to the tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          tap=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/DmitryKorolev/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula"
          cp Formula/tl.rb "$tap/Formula/tl.rb"
          cd "$tap"
          git config user.name "tl release"
          git config user.email "tl-release@users.noreply.github.com"
          git add Formula/tl.rb
          if git diff --cached --quiet; then
            echo "the tap already carries this formula"
            exit 0
          fi
          git commit -m "tl ${GITHUB_REF_NAME}: pin the released digests"
          git push

  # ---------------------------------------------------------------------------
  # 5. npm.
  #
  # After the GitHub Release, not before: the release is the source of truth
  # for artifacts, and npm is a veneer over it (ADR-0006). Publishing npm first
  # would let a failure between the two leave a version on the registry with no
  # signed artifacts to check it against — and npm versions cannot be reused.
  #
  # Trusted publishing (OIDC), so there is no long-lived npm token in this
  # repository. Each of the five packages must have this workflow registered as
  # its trusted publisher on npmjs.com; a package that does not will fail here
  # with npm's own error rather than fall back to a token.
  # ---------------------------------------------------------------------------
  publish-npm:
    needs: [stamp, publish-release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # A pinned version, and no lifecycle scripts. This job holds
      # `id-token: write`, and every job defined inline in this file shares one
      # `job_workflow_ref`, so a certificate minted here would satisfy the
      # release pin — an unpinned `npm@latest` would be arbitrary code running
      # next to that capability. Bumped deliberately, like ELAN_VERSION.
      - name: install the pinned npm CLI
        env:
          NPM_VERSION: "11.5.1"
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts "npm@${NPM_VERSION}"
          npm --version

      # The verified set, not the raw candidates: the npm tarballs must carry
      # the exact bytes the release signed, so that comparing an npm binary
      # against the release asset is a meaningful check.
      - name: download the signed assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tl-signed-release

      # The npm packages must carry the binaries the release signed, not a
      # rebuild. These are the same artifacts sign-and-publish attested, so a
      # user can compare an npm tarball's binary against the release asset and
      # verify that asset's Sigstore bundle.
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The other two consumers of tl-signed-release re-verify what they
      # received; so does this one. Re-establishing the invariant at each
      # artifact boundary is cheap, and "an earlier job checked it" is an
      # assumption rather than a check.
      - name: verify what arrived, before packaging it
        run: |
          set -euo pipefail
          ./scripts/verify-release-artifacts.sh --selftest
          # shellcheck disable=SC2046
          ./scripts/verify-release-artifacts.sh --require-signature dist $(cat asset-names)

      - name: stage the npm packages around the signed binaries
        run: ./scripts/npm-pack.sh npm-staging dist

      # --selftest exercises the package *sources* with stub binaries; this
      # checks the staged tree that is about to be published, running the real
      # signed binary and asserting it reports the commit this release names.
      - name: the staged packages carry the released binary
        run: ./scripts/npm-pack.sh --check-staged npm-staging "${{ needs.stamp.outputs.commit }}"

      - name: publish
        run: |
          set -euo pipefail
          # A prerelease tag must not become what `npm install @taskloop/tl`
          # resolves to. npm applies `latest` unless told otherwise, and a
          # published version cannot be reissued under a different tag without
          # a manual dist-tag fix.
          case "${GITHUB_REF_NAME}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          # scripts/npm-publish.sh rather than a loop of `npm publish`. npm
          # versions are immutable, so a loop that dies half way through
          # strands the version permanently: the packages that went out cannot
          # be replaced, the launcher that publishes last never went out at
          # all, and a re-run dies on E403 for the first package. The script
          # asks the registry what is already there, publishes what is missing,
          # accepts what matches, and stops on a version whose contents differ
          # — so re-running this job is always safe and always converges.
          #
          # Which packages exist in the staging tree is npm-pack.sh's decision,
          # taken from the ADR-0006 tiers: a Best-effort target that did not
          # build is absent from the tree *and* dropped from the launcher's
          # optionalDependencies. The loop this replaces warned that the
          # launcher "still lists it as an optional dependency", which was the
          # opposite of what was published.
          ./scripts/npm-publish.sh npm-staging "$dist_tag"
