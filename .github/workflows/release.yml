# Release pipeline for tl — native artifacts on a SemVer tag.
#
# This workflow path is part of the signing identity: GitHub's OIDC certificate
# names the workflow that requested it, and `release/identity.json` pins that
# name. Signing therefore runs *directly here* rather than in a reusable
# workflow, which would change the certificate's `job_workflow_ref` and break
# the pin every verifier checks (ADR-0006 "Release integrity and provenance").
# Renaming or moving this file is an identity rotation, not a refactor: see the
# rotation procedure in VERIFYING.md.
#
# The correctness gates themselves live in ci.yml and AGENTS.md; this workflow
# re-runs them against the tagged commit rather than trusting that the tag
# happens to point at a commit CI already saw.
name: Release

on:
  push:
    tags:
      # SemVer releases and pre-releases. The same shape the pinned certificate
      # identity regexp accepts — a tag outside it would produce artifacts no
      # verifier could accept, so it must not start a release.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # A build-only rehearsal: everything up to and including the artifacts and
  # their smoke tests, with no signing and no GitHub Release. Useful for
  # exercising the matrix before committing to a tag, and safe because a
  # non-tag run could not produce a certificate identity that verifies anyway.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The Linux artifacts are built inside this image so they inherit its glibc
  # rather than the runner's. Ubuntu 18.04 carries glibc 2.27, the floor
  # ADR-0006 documents (Lean's own floors are 2.26 on x86-64 and 2.27 on
  # aarch64). Pinned by multi-arch index digest, so both Linux legs resolve the
  # same published image and a moved tag cannot change what we build against.
  GLIBC_FLOOR_IMAGE: "ubuntu@sha256:152dc042452c496007f07ca9127571cb9c29697f42acbfad72324b2bb2e43c98"
  GLIBC_FLOOR: "2.27"
  # elan installs the pinned Lean toolchain inside that image, where the
  # node-based setup actions cannot run. Hash-pinned like the floor-git tarball
  # in ci.yml: the download is checked before it is executed. The per-target
  # digests are in the build matrix, next to the triple they belong to.
  ELAN_VERSION: "v4.2.3"

jobs:
  # ---------------------------------------------------------------------------
  # 1. The correctness gates, on the exact commit being released.
  # ---------------------------------------------------------------------------
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: task-id lint selftest
        run: ./scripts/check-task-ids.sh --selftest
      - name: task-id leakage
        run: ./scripts/check-task-ids.sh

      # The pin this workflow's own signature will be checked against, and the
      # generator the stamp job is about to run. Both are cheap and both are
      # load-bearing for what this release publishes.
      - name: release identity selftest
        run: ./scripts/check-release-identity.sh --selftest
      - name: release identity discriminates
        run: ./scripts/check-release-identity.sh
      - name: build-provenance generator selftest
        run: ./scripts/gen-build-provenance.sh --selftest

      # Restore-only. ci.yml's policy is that only protected main saves the
      # shared caches; a tag build consumes them and saves nothing.
      - name: restore mathlib olean archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mathlib
          key: trusted-main-v1-mathlib-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: build (lake build --wfail)
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "true"
          build-args: "--wfail"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"

      - name: build trust verifier warning-free
        run: lake build tlverify --wfail
      - name: trust boundary (lake exe tlverify)
        run: lake exe tlverify
      - name: test (lake exe tltest)
        run: lake exe tltest

  # ---------------------------------------------------------------------------
  # 2. One build stamp for the whole matrix.
  #
  # Every artifact must report the same source commit and dependency identity.
  # Generating the stamp once and shipping it to each leg makes that true by
  # construction, instead of relying on four independent runs of the generator
  # agreeing.
  # ---------------------------------------------------------------------------
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      commit: ${{ steps.stamp.outputs.commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: stamp the tagged commit
        id: stamp
        run: |
          set -euo pipefail
          # The product version the binary will report, from the one place that
          # defines it.
          version=$(sed -n 's/^def productVersion : String := "\(.*\)"$/\1/p' Tl/Cli/Commands.lean)
          if [ -z "$version" ]; then
            echo "::error::could not read productVersion from Tl/Cli/Commands.lean — the definition moved or changed shape. Update this step to match it; the tag-vs-version check below depends on it."
            exit 1
          fi

          # On a tag, the tag and the compiled version must agree. They are
          # edited in different commits by different hands, and a mismatch
          # would ship a binary whose self-reported version contradicts the
          # release it is published under.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match productVersion '${version}' in Tl/Cli/Commands.lean. Bump productVersion (and the lakefile package version) to ${tag_version} and re-tag, or tag v${version} instead."
              exit 1
            fi
          fi

          ./scripts/gen-build-provenance.sh --stamp

          commit=$(git rev-parse HEAD)
          # A fresh checkout is clean; a dirty stamp means something wrote into
          # the tree before this step, and the artifacts would not correspond
          # to the tagged source.
          if grep -q 'stampDirty : Bool := true' Tl/Build/Stamp.lean; then
            echo "::error::the stamped checkout is dirty — something modified the working tree before stamping. Release artifacts must correspond exactly to the tagged commit; find and remove the step that writes into the checkout."
            exit 1
          fi
          if ! grep -q "stampCommit : String := \"${commit}\"" Tl/Build/Stamp.lean; then
            echo "::error::the generated stamp does not carry HEAD (${commit}) — scripts/gen-build-provenance.sh did not stamp what this job checked out."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          cat Tl/Build/Stamp.lean

      - name: upload the stamp
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tl-build-stamp
          path: Tl/Build/Stamp.lean
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3. The four native artifacts.
  #
  # Native per target: Lean cross-compiles poorly, so each artifact is built on
  # its own architecture and operating system (ADR-0006 "Build approach").
  # ---------------------------------------------------------------------------
  build:
    needs: [gates, stamp]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-latest
            container: true
            elan_triple: x86_64-unknown-linux-gnu
            elan_sha256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            container: true
            elan_triple: aarch64-unknown-linux-gnu
            elan_sha256: cb69af0803b04157bc30201c29c12fca882bb3ad8b43476b8d2d3064810bc3ac
          - target: darwin-arm64
            runs-on: macos-14
            container: false
          # macOS x86-64 is Lean Tier 2 and our Best-effort tier: smoke-tested,
          # not release-blocking (ADR-0006). fail-fast is off so a failure here
          # does not take the Supported artifacts down with it. macos-15-intel
          # is the last x86-64 macOS image GitHub offers.
          - target: darwin-x64
            runs-on: macos-15-intel
            container: false
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: download the stamp
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tl-build-stamp
          path: Tl/Build

      - name: confirm the shared stamp landed
        run: |
          set -euo pipefail
          if ! grep -q "stampCommit : String := \"${{ needs.stamp.outputs.commit }}\"" Tl/Build/Stamp.lean; then
            echo "::error::this leg's Tl/Build/Stamp.lean is not the stamp job's artifact — the download step overwrote the wrong path, or the artifact is stale. Every leg must compile the same stamp."
            exit 1
          fi

      - name: restore mathlib olean archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mathlib
          key: trusted-main-v1-mathlib-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      # --- Linux: build inside the glibc-floor image ---------------------------
      #
      # The node-based setup actions cannot run in an image this old, so the
      # whole build is one `docker run`: install elan from a hash-pinned
      # tarball, fetch the mathlib olean cache, build the binary. The host's
      # ~/.cache/mathlib is mounted in so the restore above is not wasted.
      - name: build inside the glibc ${{ env.GLIBC_FLOOR }} image
        if: matrix.container
        env:
          ELAN_SHA256: ${{ matrix.elan_sha256 }}
          ELAN_TRIPLE: ${{ matrix.elan_triple }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/mathlib"
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$HOME/.cache/mathlib:/root/.cache/mathlib" \
            -e ELAN_VERSION="${ELAN_VERSION}" \
            -e ELAN_SHA256="${ELAN_SHA256}" \
            -e ELAN_TRIPLE="${ELAN_TRIPLE}" \
            "${GLIBC_FLOOR_IMAGE}" \
            bash -euo pipefail -c '
              # 18.04 is past end of standard support; its archives moved.
              sed -i "s|http://archive.ubuntu.com|http://old-releases.ubuntu.com|g; s|http://security.ubuntu.com|http://old-releases.ubuntu.com|g" /etc/apt/sources.list
              apt-get update -q
              apt-get install -y -q --no-install-recommends \
                ca-certificates curl git gcc libc6-dev make xz-utils
              # The checkout is owned by the runner user, not root.
              git config --global --add safe.directory /src

              tmp=$(mktemp -d)
              curl -sSfL --retry 3 -o "$tmp/elan.tar.gz" \
                "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-${ELAN_TRIPLE}.tar.gz"
              echo "${ELAN_SHA256}  $tmp/elan.tar.gz" | sha256sum -c -
              tar -xzf "$tmp/elan.tar.gz" -C "$tmp"
              "$tmp/elan-init" -y --default-toolchain none >/dev/null
              export PATH="/root/.elan/bin:$PATH"
              elan toolchain install "$(cat lean-toolchain)"
              elan override set "$(cat lean-toolchain)"

              # Prebuilt mathlib oleans; building them from source would take
              # hours. A miss is fatal rather than silently slow.
              lake exe cache get
              lake build tl
            '
          # The container wrote as root; hand both trees back so later steps and
          # the runner cleanup can touch them.
          sudo chown -R "$(id -u):$(id -g)" .lake "$HOME/.cache/mathlib"

      # --- macOS: build on the runner -----------------------------------------
      - name: build (macOS)
        if: ${{ !matrix.container }}
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "true"
          build-args: "tl"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"

      - name: stage the artifact
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .lake/build/bin/tl "dist/tl-${{ matrix.target }}"
          chmod +x "dist/tl-${{ matrix.target }}"
          echo "asset=tl-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      # An unsigned macOS download is quarantined by Gatekeeper. An ad-hoc
      # signature does not clear quarantine on its own, but it does keep the
      # binary from being killed outright once the user removes the attribute
      # per the install instructions (ADR-0006 "Runtime prerequisites and
      # signing"; notarization is deferred). Signing changes the bytes, so it
      # happens before anything digests them.
      - name: ad-hoc codesign (macOS)
        if: ${{ !matrix.container }}
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none "dist/${{ steps.stage.outputs.asset }}"
          codesign --verify --verbose "dist/${{ steps.stage.outputs.asset }}"

      # The floor is a property of the produced binary, so it is asserted on
      # the binary rather than inferred from the base image: a base-image bump
      # that quietly raised the requirement would otherwise ship silently.
      - name: assert the glibc floor (Linux)
        if: matrix.container
        run: |
          set -euo pipefail
          asset="dist/${{ steps.stage.outputs.asset }}"
          highest=$(readelf --dyn-syms --wide "$asset" \
            | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sed 's/GLIBC_//' | sort -V | tail -1)
          if [ -z "$highest" ]; then
            echo "::error::found no GLIBC_ version references in $asset — either it is statically linked (then delete this check and record why in ADR-0006) or readelf did not read it. Do not publish an unchecked artifact."
            exit 1
          fi
          echo "highest glibc symbol version required: ${highest} (floor ${GLIBC_FLOOR})"
          if [ "$(printf '%s\n%s\n' "$GLIBC_FLOOR" "$highest" | sort -V | tail -1)" != "${GLIBC_FLOOR}" ]; then
            echo "::error::${asset} requires glibc ${highest}, above the ADR-0006 floor of ${GLIBC_FLOOR}. The build image drifted upward: repin GLIBC_FLOOR_IMAGE to an image at or below the floor, or change the floor in ADR-0006 deliberately and update the docs and installer with it."
            exit 1
          fi

      # macOS has no equivalent gate: the minimum OS version is inherited from
      # Lean's own prebuilt libraries rather than chosen here, so it is recorded
      # with the release instead of asserted (ADR-0006 "Build approach").
      - name: record the macOS minimum version
        if: ${{ !matrix.container }}
        run: otool -l "dist/${{ steps.stage.outputs.asset }}" | grep -A4 LC_BUILD_VERSION || true

      # Smoke test: the artifact must run, report the provenance this release
      # claims, and complete a real task round-trip. `tl version` alone would
      # pass on a binary that cannot touch a repository.
      - name: smoke-test the artifact
        run: |
          set -euo pipefail
          asset="$PWD/dist/${{ steps.stage.outputs.asset }}"
          "$asset" version
          "$asset" version --json > version.json
          cat version.json
          jq -e --arg v "${{ needs.stamp.outputs.version }}" --arg c "${{ needs.stamp.outputs.commit }}" '
            .ok == true
            and .data.version == $v
            and .data.build.kind == "clean"
            and .data.build.commit == $c
            and .data.build.dirty == false
            and (.data.build.toolchain | startswith("leanprover/lean4:"))
            and (.data.build.manifestDigest | test("^[0-9a-f]{64}$"))
          ' version.json
          "$asset" help --json | jq -e '.ok == true and (.data.commands | length) > 0' > /dev/null

          scratch=$(mktemp -d)
          cd "$scratch"
          git init -q .
          git config user.email tl-release-smoke@example.invalid
          git config user.name "tl release smoke"
          "$asset" init --json | jq -e '.ok == true' > /dev/null
          id=$(TL_ACTOR=release-smoke "$asset" create "smoke" --json | jq -r '.data.id')
          TL_ACTOR=release-smoke "$asset" claim "$id" --json | jq -e '.data.claim.outcome == "won"' > /dev/null
          TL_ACTOR=release-smoke "$asset" close "$id" --as done --json | jq -e '.ok == true' > /dev/null
          "$asset" ready --json | jq -e '.data.count == 0' > /dev/null
          "$asset" doctor --json | jq -e '.data.healthy == true' > /dev/null
          echo "smoke test passed for ${{ matrix.target }}"

      - name: upload the release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tl-candidate-${{ matrix.target }}
          path: dist/${{ steps.stage.outputs.asset }}
          if-no-files-found: error
          retention-days: 7
