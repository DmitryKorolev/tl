# CI for tl — platform, job graph, gates, and cache strategy are recorded in
# docs/adr/ADR-0026-continuous-integration.md. The gate list itself lives in
# AGENTS.md ("CI gates"); this workflow is its mechanization.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on PRs and feature refs, but never on main: main runs
# populate the shared caches that PR runs restore from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  # Build the separately scoped release tool and run its typed CI registry.
  # This job remains independent of the product build matrix.
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # actionlint is the one gate in the policy that needs a tool the runner
      # does not ship. Installed here, hash-pinned like every other downloaded
      # tool in this repository, and then found on PATH by the typed policy —
      # which refuses to skip it under --strict, so a broken download is a
      # failed job rather than a quietly smaller policy.
      - name: install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl -sSfL --retry 3 -o "$tmp/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp" actionlint
          install -m 0755 "$tmp/actionlint" /usr/local/bin/actionlint
          actionlint --version
          # ShellCheck is preinstalled on ubuntu-latest, and both gates need
          # it: actionlint shells out to it for every `run:` block and silently
          # checks only the YAML without it, and the policy's own shell gate
          # refuses to run at all. Asserting it here turns a runner-image
          # change from a quietly smaller policy into a failed step.
          shellcheck --version

      # Both workflows read release/Policy.lean. CI always exercises deferred
      # Homebrew and npm; the release profile selects channels from the plan.
      - name: install the pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"

      - name: build the typed release policy
        run: lake build tlrelease --wfail

      - name: release policy
        run: ./.lake/build/bin/tlrelease policy --profile ci --strict

      # The hermetic job executes the typed release profile without the
      # forbidden runtimes on every commit, before a tag exists.

  # Dynamic dependency-budget evidence for the first-party GitHub-only release
  # path. JavaScript actions stay in the outer job; one ordinary run step
  # prepares digest-checked static tools and launches a nested container with
  # no network, credentials, publication authority, or container-engine socket. The
  # checkout is an input capability only (read-only); every output goes to the
  # separately mounted scratch directory.
  hermetic-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERMETIC_IMAGE: docker.io/alpine/git@sha256:53a6239398162098fed2f49a46512f9cbba9e3f31b9f2cea4fa90129ee069a99
      BUSYBOX_STATIC_VERSION: "1.37.0-r20"
      BUSYBOX_STATIC_SHA256: "488ad6efd04b5a722719e79f8e0dcc2c24afd6758867af3ce41b04839e60c74b"
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      HERMETIC_REQUIRED_TOOLS: "awk basename cat chmod cp cut dirname env find git grep head id ln ls mkdir mktemp mv pwd readlink rm sed sha256sum sh shellcheck sleep sort stat tail tar touch tr uname wc actionlint tlrelease"
      HERMETIC_FORBIDDEN_RUNTIMES: "python python3 ruby brew node npm"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: install the pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"

      - name: build the static release tool for the stripped container
        run: lake build tlreleaseStatic --wfail

      - name: runtime-stripped release policy and retained-adapter suites
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/hermetic-release"
          rm -rf "$scratch"
          mkdir -p "$scratch/static" "$scratch/tools" "$scratch/lib" "$scratch/lib64" "$scratch/tmp" "$scratch/home"
          [ "$(podman info --format '{{.Host.Security.Rootless}}')" = true ]

          curl -sSfL --retry 3 -o "$scratch/busybox-static.apk" \
            "https://dl-cdn.alpinelinux.org/alpine/v3.22/main/x86_64/busybox-static-${BUSYBOX_STATIC_VERSION}.apk"
          echo "${BUSYBOX_STATIC_SHA256}  $scratch/busybox-static.apk" | sha256sum -c -
          tar -xzf "$scratch/busybox-static.apk" -C "$scratch/static" bin/busybox.static
          chmod 0755 "$scratch/static/bin/busybox.static"

          # Copy libraries from the same pinned image without executing it.
          # The policy uses them before the static launcher suite varies loaders.
          library_source=$(podman create --platform linux/amd64 "$HERMETIC_IMAGE")
          trap 'podman rm -f "$library_source" >/dev/null' EXIT
          podman cp "$library_source:/lib/." "$scratch/lib"
          podman rm "$library_source" >/dev/null
          trap - EXIT

          # Packing belongs to the outer packaging environment. Only the
          # extracted launcher enters the runtime-stripped container.
          mkdir -p "$scratch/packed" "$scratch/npm-cache"
          touch "$scratch/npm-userconfig" "$scratch/npm-globalconfig"
          npm --cache "$scratch/npm-cache" --userconfig "$scratch/npm-userconfig" --globalconfig "$scratch/npm-globalconfig" \
            pack ./npm/tl --ignore-scripts --pack-destination "$scratch/packed"
          tar -xzf "$scratch/packed/taskloop-tl-0.0.0.tgz" -C "$scratch/packed" package/bin/tl
          cmp npm/tl/bin/tl "$scratch/packed/package/bin/tl"

          curl -sSfL --retry 3 -o "$scratch/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $scratch/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$scratch/actionlint.tar.gz" -C "$scratch/tools" actionlint

          curl -sSfL --retry 3 -o "$scratch/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $scratch/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$scratch/shellcheck.tar.xz" -C "$scratch"
          install -m 0755 "$scratch/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$scratch/tools/shellcheck"
          chmod 0755 "$scratch/tools/actionlint"
          install -m 0755 .lake/build/bin/tlrelease-static "$scratch/tools/tlrelease"

          # The native installer corpus owns its isolated curl fixture and
          # checks its per-invocation reachability inside the policy gate.

          # This is generated workflow test code, not a fourth tracked shell
          # program. It drives the exact launcher bytes copied into each
          # installed-tree fixture; uname comes from a PATH collaborator and
          # libc comes from the writable /lib and /lib64 observation mounts.
          cat > "$scratch/launcher-suite" <<'LAUNCHER_SUITE'
          #!/bin/sh
          set -eu
          source_launcher=/scratch/packed/package/bin/tl
          work=/scratch/launcher
          failures=0

          note() {
            if [ "$1" -eq 0 ]; then
              echo "  ok   $2"
            else
              echo "  FAIL $2" >&2
              failures=$((failures + 1))
            fi
          }

          prepare() {
            name=$1
            observed_os=$2
            observed_arch=$3
            observed_libc=$4
            case_root="$work/$name"
            rm -rf "$case_root"
            mkdir -p "$case_root/tl/bin" "$case_root/observe"
            cp "$source_launcher" "$case_root/tl/bin/tl"
            chmod 0755 "$case_root/tl/bin/tl"
            cat > "$case_root/observe/uname" <<UNAME_STUB
          #!/bin/sh
          printf '%s\n' "\${1-}" >> '$case_root/uname-calls'
          case \${1-} in
            -s) printf '%s\n' '$observed_os' ;;
            -m) printf '%s\n' '$observed_arch' ;;
            *) printf '%s\n' '$observed_os' ;;
          esac
          UNAME_STUB
            chmod 0755 "$case_root/observe/uname"
            rm -f /lib64/ld-linux-x86-64.so.2 /lib/ld-linux-aarch64.so.1 /lib/ld-musl-*.so.1
            case $observed_libc in
              glibc) : > /lib64/ld-linux-x86-64.so.2; : > /lib/ld-musl-test.so.1 ;;
              arm64-only) : > /lib/ld-linux-aarch64.so.1 ;;
              arm64-with-musl) : > /lib/ld-linux-aarch64.so.1; : > /lib/ld-musl-test.so.1 ;;
              musl) : > /lib/ld-musl-test.so.1 ;;
              neither) : ;;
              *) echo "launcher suite: unknown libc observation '$observed_libc'" >&2; exit 2 ;;
            esac
          }

          binary_path() {
            target=$1
            layout=$2
            case $layout in
              hoisted) printf '%s\n' "$case_root/tl-bin-$target/bin/tl" ;;
              nested) printf '%s\n' "$case_root/tl/node_modules/@taskloop/tl-bin-$target/bin/tl" ;;
              *) echo "launcher suite: unknown package layout '$layout'" >&2; exit 2 ;;
            esac
          }

          plant() {
            target=$1
            layout=$2
            mode=$3
            candidate=$(binary_path "$target" "$layout")
            mkdir -p "$(dirname -- "$candidate")"
            printf '#!/bin/sh\nprintf "selected %s\\n" "$*"\n' "$target" > "$candidate"
            chmod "$mode" "$candidate"
          }

          drive() {
            run_status=0
            run_out=$(PATH="$case_root/observe:$PATH" "$case_root/tl/bin/tl" "$@" 2>&1) || run_status=$?
          }

          selection() {
            name=$1; observed_os=$2; observed_arch=$3; observed_libc=$4
            target=$5; layout=$6
            prepare "$name" "$observed_os" "$observed_arch" "$observed_libc"
            plant "$target" "$layout" 0755
            drive one "two three"
            note "$([ "$run_status" -eq 0 ] && [ "$run_out" = "selected $target" ] && echo 0 || echo 1)" \
              "$name selects $layout @taskloop/tl-bin-$target"
          }

          echo "npm launcher hermetic suite:"
          rm -rf "$work"
          mkdir -p "$work"
          note "$([ /bin/sh -ef /scratch/static/bin/busybox.static ] && echo 0 || echo 1)" \
            "the launcher suite reaches the static shell fixture"
          source_digest=$(sha256sum "$source_launcher" | cut -d' ' -f1)

          selection darwin-arm64 Darwin arm64 musl darwin-arm64 hoisted
          selection darwin-x64 Darwin x86_64 musl darwin-x64 hoisted
          selection linux-arm64 Linux arm64 glibc linux-arm64 hoisted
          selection linux-x64 Linux x86_64 glibc linux-x64 hoisted
          selection linux-aarch64-alias Linux aarch64 glibc linux-arm64 hoisted
          selection linux-amd64-alias Linux amd64 glibc linux-x64 hoisted
          selection nested-layout Linux x86_64 glibc linux-x64 nested

          prepare nested-after-unusable Linux x86_64 glibc
          plant linux-x64 hoisted 0644
          plant linux-x64 nested 0755
          drive
          note "$([ "$run_status" -eq 0 ] && [ "$run_out" = 'selected linux-x64' ] && echo 0 || echo 1)" \
            "an unusable hoisted candidate does not hide an executable nested one"

          prepare native-windows MINGW64_NT-10.0 x86_64 glibc
          drive
          note "$([ "$run_status" -eq 1 ] && printf '%s' "$run_out" | grep -q WSL2 && echo 0 || echo 1)" \
            "native Windows refuses with WSL2 guidance"

          prepare unsupported-os FreeBSD amd64 glibc
          drive
          note "$([ "$run_status" -eq 1 ] && printf '%s' "$run_out" | grep -q "unsupported operating system 'FreeBSD'" && echo 0 || echo 1)" \
            "an unsupported operating system is named"

          prepare unsupported-cpu Linux riscv64 glibc
          drive
          note "$([ "$run_status" -eq 1 ] && printf '%s' "$run_out" | grep -q "unsupported CPU architecture 'riscv64'" && echo 0 || echo 1)" \
            "an unsupported CPU architecture is named"

          prepare missing-package Linux x86_64 glibc
          drive
          note "$([ "$run_status" -eq 1 ] && printf '%s' "$run_out" | grep -q 'not installed' && printf '%s' "$run_out" | grep -q optional && echo 0 || echo 1)" \
            "a missing platform package names the cause and repair"

          prepare mismatched-package Darwin x86_64 musl
          plant darwin-arm64 hoisted 0755
          drive
          note "$([ "$run_status" -eq 1 ] && printf '%s' "$run_out" | grep -q 'what is installed: tl-bin-darwin-arm64' && printf '%s' "$run_out" | grep -q Rosetta && echo 0 || echo 1)" \
            "an installed package for another architecture explains npm selection"

          prepare non-executable Linux x86_64 glibc
          plant linux-x64 hoisted 0644
          drive
          note "$([ "$run_status" -eq 1 ] && printf '%s' "$run_out" | grep -q 'exists but is not executable' && printf '%s' "$run_out" | grep -q 'chmod +x' && echo 0 || echo 1)" \
            "a present non-executable package names the mode repair"

          prepare musl-missing Linux x86_64 musl
          drive
          note "$([ "$run_status" -eq 1 ] && printf '%s' "$run_out" | grep -q 'uses musl libc' && printf '%s' "$run_out" | grep -q 'was never installed' && echo 0 || echo 1)" \
            "musl explains why npm omitted the package"

          prepare musl-present Linux x86_64 musl
          plant linux-x64 hoisted 0755
          drive
          note "$([ "$run_status" -eq 1 ] && printf '%s' "$run_out" | grep -q 'uses musl libc' && printf '%s' "$run_out" | grep -q 'glibc-based image' && echo 0 || echo 1)" \
            "musl refuses a glibc binary even when a package manager installed it"

          # Cross both on_musl call sites with every previously absent observation.
          for observation in arm64-only arm64-with-musl neither; do
            selection "$observation-present" Linux aarch64 "$observation" linux-arm64 hoisted
            prepare "$observation-missing" Linux aarch64 "$observation"
            drive
            note "$([ "$run_status" -eq 1 ] && printf '%s' "$run_out" | grep -q 'not installed' && ! printf '%s' "$run_out" | grep -q 'uses musl libc' && echo 0 || echo 1)" \
              "$observation without a package reaches the missing-package repair"
            for variant in present missing; do
              observed_case="$work/$observation-$variant"
              note "$(grep -qx -- -s "$observed_case/uname-calls" && grep -qx -- -m "$observed_case/uname-calls" && echo 0 || echo 1)" \
                "$observation-$variant reaches both uname collaborators"
              observed_digest=$(sha256sum "$observed_case/tl/bin/tl" | cut -d' ' -f1)
              note "$([ "$source_digest" = "$observed_digest" ] && echo 0 || echo 1)" \
                "$observation-$variant executes the packed launcher bytes"
            done
          done

          prepare relative-symlink Linux x86_64 glibc
          plant linux-x64 hoisted 0755
          mkdir -p "$case_root/.bin"
          ln -s ../tl/bin/tl "$case_root/.bin/tl"
          run_status=0
          run_out=$(PATH="$case_root/observe:$PATH" "$case_root/.bin/tl" 2>&1) || run_status=$?
          note "$([ "$run_status" -eq 0 ] && [ "$run_out" = 'selected linux-x64' ] && echo 0 || echo 1)" \
            "a relative npm bin symlink resolves to the package"

          prepare absolute-symlink Linux x86_64 glibc
          plant linux-x64 hoisted 0755
          mkdir -p "$case_root/.global"
          ln -s "$case_root/tl/bin/tl" "$case_root/.global/tl"
          run_status=0
          run_out=$(PATH="$case_root/observe:$PATH" "$case_root/.global/tl" 2>&1) || run_status=$?
          note "$([ "$run_status" -eq 0 ] && [ "$run_out" = 'selected linux-x64' ] && echo 0 || echo 1)" \
            "an absolute global-style symlink resolves to the package"

          prepare process-contract Linux x86_64 glibc
          candidate=$(binary_path linux-x64 hoisted)
          mkdir -p "$(dirname -- "$candidate")"
          cat > "$candidate" <<'PROCESS_STUB'
          #!/bin/sh
          IFS= read -r line
          printf 'stdin=%s\n' "$line"
          printf '<%s>\n' "$@"
          printf 'native stderr\n' >&2
          exit 42
          PROCESS_STUB
          chmod 0755 "$candidate"
          run_status=0
          printf 'stream input\n' | PATH="$case_root/observe:$PATH" "$case_root/tl/bin/tl" one "two three" \
            > "$case_root/stdout" 2> "$case_root/stderr" || run_status=$?
          note "$([ "$run_status" -eq 42 ] && echo 0 || echo 1)" \
            "the native binary's exit status passes through"
          note "$(grep -qx 'stdin=stream input' "$case_root/stdout" && grep -qx '<one>' "$case_root/stdout" && grep -qx '<two three>' "$case_root/stdout" && echo 0 || echo 1)" \
            "stdin and unsplit arguments reach the native binary"
          note "$(grep -qx 'native stderr' "$case_root/stderr" && echo 0 || echo 1)" \
            "stderr remains the native binary's stream"

          prepare process-identity Linux x86_64 glibc
          candidate=$(binary_path linux-x64 hoisted)
          mkdir -p "$(dirname -- "$candidate")"
          printf '#!/bin/sh\nprintf "%%s\\n" "$$" > "%s"\n' "$case_root/native-pid" > "$candidate"
          chmod 0755 "$candidate"
          PATH="$case_root/observe:$PATH" "$case_root/tl/bin/tl" &
          launcher_pid=$!
          wait "$launcher_pid"
          native_pid=$(cat "$case_root/native-pid")
          note "$([ "$native_pid" = "$launcher_pid" ] && echo 0 || echo 1)" \
            "exec gives the native binary the launcher's process identity"

          prepare signal-contract Linux x86_64 glibc
          candidate=$(binary_path linux-x64 hoisted)
          mkdir -p "$(dirname -- "$candidate")"
          cat > "$candidate" <<SIGNAL_STUB
          #!/bin/sh
          child=''
          trap '[ -z "\$child" ] || kill "\$child" 2>/dev/null || true; exit 7' TERM
          printf '%s\n' "\$\$" > '$case_root/native-ready'
          sleep 30 &
          child=\$!
          wait "\$child"
          SIGNAL_STUB
          chmod 0755 "$candidate"
          PATH="$case_root/observe:$PATH" "$case_root/tl/bin/tl" &
          launcher_pid=$!
          waited=0
          while [ ! -s "$case_root/native-ready" ] && [ "$waited" -lt 100 ]; do
            sleep 0.05
            waited=$((waited + 1))
          done
          kill -TERM "$launcher_pid" 2>/dev/null || true
          run_status=0
          wait "$launcher_pid" || run_status=$?
          note "$([ "$run_status" -eq 7 ] && echo 0 || echo 1)" \
            "SIGTERM reaches the native binary rather than a forwarding wrapper"

          copied_digest=$(sha256sum "$work/linux-x64/tl/bin/tl" | cut -d' ' -f1)
          note "$([ "$source_digest" = "$copied_digest" ] && echo 0 || echo 1)" \
            "the suite ran byte-identical launcher copies"
          if [ "$failures" -ne 0 ]; then
            echo "npm launcher hermetic suite: $failures broken case(s)" >&2
            exit 1
          fi
          echo "npm launcher hermetic suite: passed"
          LAUNCHER_SUITE
          chmod 0755 "$scratch/launcher-suite"

          {
            sha256sum "$scratch/static/bin/busybox.static"
            sha256sum "$scratch/tools/tlrelease"
            sha256sum "$scratch/tools/actionlint"
            sha256sum "$scratch/tools/shellcheck"
            sha256sum "$scratch/launcher-suite"
            sha256sum "$scratch/packed/package/bin/tl"
          } | sed "s|$scratch|/scratch|" > "$scratch/positive-inputs.sha256"

          podman run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --read-only-tmpfs=false \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --userns host \
            --user 0:0 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$scratch,target=/scratch" \
            --mount "type=bind,source=$scratch/static/bin/busybox.static,target=/bin/busybox,readonly" \
            --mount "type=bind,source=$scratch/lib,target=/lib" \
            --mount "type=bind,source=$scratch/lib64,target=/lib64" \
            --workdir /workspace \
            --env HOME=/scratch/home \
            --env TMPDIR=/scratch/tmp \
            --env "HERMETIC_REQUIRED_TOOLS=$HERMETIC_REQUIRED_TOOLS" \
            --env "HERMETIC_FORBIDDEN_RUNTIMES=$HERMETIC_FORBIDDEN_RUNTIMES" \
            --env PATH=/scratch/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --entrypoint /bin/sh \
            "$HERMETIC_IMAGE" -eu -c '
              [ "$(id -u)" = "$(stat -c %u /scratch)" ]
              [ "$(id -g)" = "$(stat -c %g /scratch)" ]
              : > /scratch/write-probe
              if ( : > /workspace/.hermetic-write-probe ) 2>/dev/null; then
                echo "hermetic release: the checkout mount is writable" >&2
                exit 1
              fi
              [ ! -e /var/run/docker.sock ] || {
                echo "hermetic release: a container-engine socket entered the inner container" >&2
                exit 1
              }
              [ ! -e /run/podman/podman.sock ]
              [ ! -e /run/user/0/podman/podman.sock ]
              for runtime in $HERMETIC_FORBIDDEN_RUNTIMES; do
                if command -v "$runtime" >/dev/null 2>&1; then
                  echo "hermetic release: forbidden runtime $runtime is on PATH" >&2
                  exit 1
                fi
                hits=$(find / -xdev \( -type f -o -type l \) \( -name "$runtime" -o -name "$runtime[0-9]*" -o -name nodejs \) -print)
                [ -z "$hits" ] || {
                  echo "hermetic release: forbidden runtime $runtime exists in the image: $hits" >&2
                  exit 1
                }
              done
              for tool in $HERMETIC_REQUIRED_TOOLS; do
                command -v "$tool" >/dev/null 2>&1 || {
                  echo "hermetic release: required input $tool is absent" >&2
                  exit 1
                }
                printf "hermetic input: %s=%s\n" "$tool" "$(command -v "$tool")"
              done
              sha256sum -c /scratch/positive-inputs.sha256
              git --version
              shellcheck --version
              actionlint -version
              shellcheck -S warning -s sh /scratch/launcher-suite
              tlrelease policy --profile release --strict
              /scratch/launcher-suite
              echo "hermetic release: policy and all three retained-adapter suites passed"
            '

  # The formula, judged by Homebrew rather than by us.
  #
  # `ruby -c` proves the file parses; it says nothing about whether Homebrew
  # will accept it. The gap was not theoretical: a rendered formula that dropped
  # its Best-effort block had no url for Intel macOS, and a stable spec with no
  # url for the running platform makes Homebrew raise
  # `formula requires at least a URL` when the formula is *loaded* — for `brew
  # info`, `brew upgrade`, and any `brew update` that touches the tap, with a
  # Ruby backtrace and "Please report this issue". Every gate in this
  # repository passed that formula.
  #
  # So this job loads and audits four formulae with real Homebrew: the tracked
  # placeholder, a fully pinned release, one with the Best-effort target
  # dropped, and a prerelease — whose urls resolve differently from the others,
  # because Homebrew's version scanner drops a SemVer suffix. Loading is the
  # check that matters most: `brew info` fails on exactly the class above.
  #
  # All four are files `tlrelease` rendered, kept in step with the renderer by
  # Tests/ReleaseToolTests.lean, which compares each byte-for-byte against what
  # `Release.Homebrew.render` produces on the same commit. This job therefore
  # needs no Lean toolchain and no interpreter: what brew judges is what a
  # release publishes, and the build-and-test job is what says so.
  homebrew-formula:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: audit them as Homebrew would
        run: |
          set -euo pipefail
          brew tap-new tlci/formula --no-git
          tap=$(brew --repository tlci/formula)
          failures=0
          for candidate in Formula/tl.rb Tests/fixtures/homebrew/full.rb \
                           Tests/fixtures/homebrew/dropped.rb \
                           Tests/fixtures/homebrew/prerelease.rb; do
            echo "── $candidate"
            cp "$candidate" "$tap/Formula/tl.rb"
            # Load first: this is the check that catches a spec with no url for
            # the running platform, which every other gate passes.
            if ! brew info --formula tlci/formula/tl > /dev/null; then
              echo "::error::$candidate does not load in Homebrew. A formula that raises on load breaks every brew command for users of the tap, not only 'brew install tl'."
              failures=$((failures + 1))
              continue
            fi
            brew style tlci/formula/tl || { echo "::error::brew style rejected $candidate"; failures=$((failures + 1)); }
            brew audit --formula --skip-style tlci/formula/tl || { echo "::error::brew audit rejected $candidate"; failures=$((failures + 1)); }
            # The *version Homebrew arrived at*, not the url it echoed back.
            # Every url in a rendered formula names its tag literally, so
            # comparing the resolved url against that tag can only restate the
            # file. The scanned version is the thing that can differ: Homebrew
            # drops a SemVer prerelease suffix when it reads one out of a url,
            # and `install` composes the signature bundle and notice urls from
            # `#{version}` — so a prerelease that lost its explicit `version`
            # line resolves to the stable number and every install 404s, with
            # every url in the file still naming the right tag.
            #
            # Read with the jq every runner has rather than an interpreter this
            # repository would then owe a dependency row for.
            resolved=$(brew info --json=v2 --formula tlci/formula/tl | jq -r '.formulae[0].versions.stable')
            case "$candidate" in
              *prerelease*) want=1.2.3-rc.1 ;;
              Formula/tl.rb) want=0.0.0 ;;
              *) want=1.2.3 ;;
            esac
            if [ "$resolved" != "$want" ]; then
              echo "::error::$candidate resolves to version $resolved, not $want — Homebrew scanned a different version than the formula was rendered for, and \`install\` composes its bundle and notice urls from that value."
              failures=$((failures + 1))
            fi
          done
          brew untap tlci/formula
          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures formula(e) were rejected by Homebrew's own checks."
            exit 1
          fi
          echo "all four rendered formulae load, style, audit, and resolve to the tag they name"

  # Proof verification + the full outside-TCB suite, on both supported dev
  # platforms. `lake build --wfail` turns any warning (including
  # cache-replayed ones) into failure — this is the warning-free-build gate.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Cache strategy (ADR-0026): reusable caches are restored on every run,
      # but only protected main may save them. A PR can therefore consume a
      # trusted cache but cannot plant executable or mutable source bytes for a
      # later commit of the same PR. Never cache .lake/packages/*/.lake (the unpacked
      # mathlib oleans, multi-GB — `lake exe cache get` restores them from
      # ~/.cache/mathlib in seconds) and never cache .tl/local/ (a byte-copy
      # of a replica id would violate a carried assumption; docs/overview.md).
      # The sources cache uses an explicit restore/save split because
      # actions/cache path exclusions cannot carve the build dirs out of a
      # bare directory pattern: the save step below prunes them first.
      - name: restore elan + toolchain
        id: elan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: trusted-main-v1-elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: restore mathlib olean archives
        id: mathlib-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mathlib
          # Deliberately OS-agnostic: the .ltar archives are
          # platform-independent, so both runners share one entry.
          key: trusted-main-v1-mathlib-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: restore dependency sources
        id: deps-src
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: trusted-main-v1-lake-packages-src-${{ hashFiles('lake-manifest.json') }}

      # lean-action installs elan, runs `lake exe cache get` (a full hit while
      # every dep rev byte-matches mathlib's manifest — the ADR-0009 pin-bump
      # check), and builds. Its own .lake cache is disabled: it would re-ship
      # the unpacked mathlib oleans per commit. No lake test_driver is
      # declared, so the suite runs as an explicit step below.
      - name: build (lake build --wfail)
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "true"
          build-args: "--wfail"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"

      - name: build trust verifier warning-free
        run: lake build tlverify --wfail

      # The native policy owns the exact adapter inventory and release checks.
      - name: build the release tool warning-free
        run: lake build tlrelease --wfail

      # No task-tracker id in a tracked artifact (AGENTS.md, "Artifacts must be
      # human-readable"; ADR-0026). It was its own toolchain-free job while it
      # was a shell script; the rule, the scope and the placeholder registry are
      # the release tool's now, so it runs where the binary exists — the same
      # move the build stamp already made.
      - name: no tracker id in a tracked artifact
        run: ./.lake/build/bin/tlrelease task-id-lint --root .

      # Exact source/module inventory, transitive axiom inspection, direct
      # dependency policy, and independent kernel replay of the safe, total
      # dependency cones. It reads source inventory on every
      # invocation, so a restored cache cannot hide an unimported source file.
      - name: trust boundary (lake exe tlverify)
        run: lake exe tlverify
      # The public test executable supervises tltestWorker and requires its
      # post-harness marker, so an imported initializer cannot exit zero before
      # any assertion runs.
      - name: test (lake exe tltest)
        run: lake exe tltest

      - name: save elan + toolchain from protected main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.elan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: trusted-main-v1-elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: save mathlib olean archives from protected main
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mathlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mathlib
          key: trusted-main-v1-mathlib-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: upload binaries for the git-floor job
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tl-binaries-linux
          path: |
            .lake/build/bin/tl
            .lake/build/bin/tltest
            .lake/build/bin/tltestWorker
            .lake/build/bin/tlrelease
          if-no-files-found: error
          retention-days: 1

      # The ADR-0006 license gate reads `.lake/packages/<pkg>/LICENSE` for every
      # manifest package, and git-floor ships no dependency sources — so those
      # ~100 KB of license files travel with the binaries rather than the whole
      # multi-gigabyte package tree. A same-run artifact, not the trusted-main
      # sources cache: that cache is keyed on `lake-manifest.json` and only main
      # may save it, so a PR that adds a dependency would miss it, while the
      # artifact always matches the commit under test. Keeping the licenses
      # provisioned is what lets git-floor run the *whole* suite at the floor,
      # rather than teaching one row to excuse itself.
      #
      # The tar paths are stored relative to the checkout root and extracted
      # there, so no artifact-layout inference is involved. An unmatched glob
      # makes tar fail the step rather than shipping an empty archive.
      - name: package the dependency licenses for the git-floor job
        if: matrix.os == 'ubuntu-latest'
        run: tar -czf lake-package-licenses.tar.gz .lake/packages/*/LICENSE

      - name: upload the dependency licenses for the git-floor job
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tl-licenses-linux
          path: lake-package-licenses.tar.gz
          if-no-files-found: error
          retention-days: 1

      # The sources cache must hold sources only: prune the per-package .lake
      # build dirs (the unpacked oleans) before saving. Saved from one leg —
      # the clones are platform-independent.
      - name: prune dependency build dirs before caching sources
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps-src.outputs.cache-hit != 'true'
        run: rm -rf .lake/packages/*/.lake

      - name: save dependency sources
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deps-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: trusted-main-v1-lake-packages-src-${{ hashFiles('lake-manifest.json') }}

  # ADR-0006 pins a runtime floor of git >= 2.17; this job proves the suite
  # still passes at exactly that floor, so a plumbing dependency above it
  # cannot slip in unnoticed. git 2.17.1 is built from a hash-pinned tarball
  # on the modern runner (an ubuntu:18.04 container cannot run current
  # node-based actions), and the PATH override is scoped to the test steps —
  # checkout and the action steps keep the runner's modern git.
  git-floor:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_FLOOR_VERSION: "2.17.1"
      GIT_FLOOR_SHA256: "79136e7aa83abae4d8a25c8111f113d3c5a63aeb5fd93cc72c26d49c6d5ba65e"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: cache the floor git
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/git-floor
          key: git-floor-${{ runner.os }}-${{ runner.arch }}-${{ env.GIT_FLOOR_VERSION }}-${{ env.GIT_FLOOR_SHA256 }}

      # Minimal build: no curl/openssl/expat/gettext/perl/python/tcltk — the
      # transport tl exercises is local plumbing only. The kernel.org
      # /pub/software tree no longer serves old release tarballs (404), so
      # two independent mirrors are tried; the pinned sha256 (which matches
      # the upstream-signed sha256sums.asc) keeps the download trustworthy
      # regardless of which mirror answered.
      - name: build git 2.17.1 from the hash-pinned tarball
        run: |
          if [ -x "$HOME/git-floor/bin/git" ] \
             && [ "$("$HOME/git-floor/bin/git" --version)" = "git version ${GIT_FLOOR_VERSION}" ]; then
            echo "floor git ${GIT_FLOOR_VERSION} restored from cache"
            exit 0
          fi
          rm -rf "$HOME/git-floor"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc make zlib1g-dev xz-utils
          tmp=$(mktemp -d)
          cd "$tmp"
          for url in \
            "https://mirror.csclub.uwaterloo.ca/kernel.org/software/scm/git/git-${GIT_FLOOR_VERSION}.tar.xz" \
            "https://distfiles.macports.org/git/git-${GIT_FLOOR_VERSION}.tar.xz"; do
            rm -f git.tar.xz
            if curl -sfL --retry 3 -o git.tar.xz "$url"; then break; fi
          done
          if [ ! -s git.tar.xz ]; then
            echo "::error::could not download git ${GIT_FLOOR_VERSION} from any mirror — check mirror availability or add a mirror to this step (keep the pinned sha256)."
            exit 1
          fi
          echo "${GIT_FLOOR_SHA256}  git.tar.xz" | sha256sum -c -
          tar xf git.tar.xz
          make -C "git-${GIT_FLOOR_VERSION}" -j"$(nproc)" prefix="$HOME/git-floor" \
            NO_CURL=1 NO_OPENSSL=1 NO_EXPAT=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 NO_TCLTK=1 \
            install >/dev/null

      - name: download the tl binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tl-binaries-linux
          path: .lake/build/bin

      - name: download the dependency licenses
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tl-licenses-linux

      # Counted against the manifest here rather than left to the license row:
      # a shortfall in provisioning and an actually-unlicensed dependency are
      # different faults with different repairs, and the row alone would report
      # both as "missing/copyleft/unclassified".
      - name: restore the dependency licenses
        run: |
          tar -xzf lake-package-licenses.tar.gz
          want=$(jq '.packages | length' lake-manifest.json)
          got=$(find .lake/packages -mindepth 2 -maxdepth 2 -name LICENSE -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$got" -ne "$want" ]; then
            echo "::error::restored $got license files for $want manifest packages — the licenses artifact is out of step with lake-manifest.json. Repair the upload glob in the build job; the license row below would otherwise report this as an unlicensed dependency."
            exit 1
          fi
          echo "restored $got dependency license files"

      # The supervised tltest worker expects the tl binary at
      # <cwd>/.lake/build/bin/tl and the repo sources/fixtures at cwd, so the
      # launcher runs from the checkout root against the artifact binaries —
      # no toolchain needed in this job. The loaded-environment group skips
      # itself here on the observed absence of a Lean sysroot; this job passes
      # no opt-out variable, so no environment can fake that skip elsewhere.
      - name: run the suite under git 2.17
        run: |
          chmod +x .lake/build/bin/tl .lake/build/bin/tltest .lake/build/bin/tltestWorker .lake/build/bin/tlrelease
          export PATH="$HOME/git-floor/bin:$PATH"
          v=$(git --version)
          if [ "$v" != "git version ${GIT_FLOOR_VERSION}" ]; then
            echo "::error::expected the floor git ${GIT_FLOOR_VERSION} on PATH, got '${v}' — the PATH override or the floor-git cache is broken."
            exit 1
          fi
          .lake/build/bin/tltest

      # Floor smoke: doctor's gitVersion row must report the floor git as ok
      # (the row can only ever warn, never flip doctor's exit code — so the
      # assertion is on the row itself, not on `healthy`).
      - name: floor smoke — init + doctor at git 2.17
        run: |
          export PATH="$HOME/git-floor/bin:$PATH"
          v=$(git --version)
          if [ "$v" != "git version ${GIT_FLOOR_VERSION}" ]; then
            echo "::error::expected the floor git ${GIT_FLOOR_VERSION} on PATH, got '${v}' — the PATH override or the floor-git cache is broken."
            exit 1
          fi
          tlbin="$PWD/.lake/build/bin/tl"
          scratch=$(mktemp -d)
          cd "$scratch"
          git init -q .
          "$tlbin" init --json > init.json
          cat init.json
          if grep -q 'below the required floor' init.json; then
            echo "::error::tl init emitted the below-floor note at the floor git — parseGitVersion / gitMeetsFloor or the init note plumbing regressed."
            exit 1
          fi
          "$tlbin" doctor --json > doctor.json
          cat doctor.json
          jq -e '.data.checks[] | select(.name == "gitVersion") | (.status == "ok") and (.version == "2.17")' doctor.json
