name = "tl"
version = "0.1.0"
defaultTargets = ["tl"]
# Proof/test discipline: batteries (std4) only — no Mathlib (ADR-0009).
# Tactics restricted to explicit calc/cases/simp-only; avoid omega/decide/aesop
# as closers. Pins are immutable commits, not branches/tags (ADR-0009).

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
# v4.30.0, matching the pinned lean-toolchain (leanprover/lean4:v4.30.0).
rev = "32dc18cde3684679f3c003de608743b57498c56f"

# Mathlib, pinned to v4.30.0 (matching the toolchain). Adopted under the
# ADR-0009 escape hatch, scoped to the reachability/cardinality proof modules
# (the finite-graph lemmas for thms 5/6/10 + rollup fuel-adequacy). See the
# ADR-0009 "Superseding note". The base CRDT/kernel layers stay Mathlib-free.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c5ea00351c28e24afc9f0f84379aa41082b1188f"

[[lean_lib]]
name = "Tl"

# The tested-shell test sources (ADR-0009); built by the `tltest` exe.
[[lean_lib]]
name = "Tests"

[[lean_exe]]
name = "tl"
root = "Main"

# In-repo test runner for the tested I/O shell (ADR-0009). `lake exe tltest`.
[[lean_exe]]
name = "tltest"
root = "Tests.Main"
